openapi: 3.2.0
info:
  version: '3.0'
  title: Enterprise Workloads V Mware API
servers:
- url: //apis.druva.com/phoenix
tags:
- name: VMware
paths:
  /vmware/v1/orgs/{OrgID}/reports/backupsets:
    get:
      description: Returns all backup sets for VMware
      tags:
      - VMware
      security:
      - Bearer: []
      summary: List all backup sets
      operationId: VMwareGetBackupsetsRequest
      parameters:
      - description: Specify the organization ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: VMNames
        description: Specify the name of the virtual machine (VM). Specify multiple VM names by separating them with commas.
        name: vmName
        in: query
        schema:
          type: string
      - x-go-name: BackupEnable
        description: 'Specify whether the backup is enabled for the virtual machine. Example: Enabled, Disabled.'
        name: backupEnable
        in: query
        schema:
          type: boolean
      - x-go-name: PageToken
        description: Specify the token to access the next page of results. Keep this field blank in the first request. Use the token value received in the previous response's parameter 'nextPageToken'.
        name: pageToken
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMwareGetBackupsetsResponse'
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or the authentication token was expired.
        '403':
          description: Forbidden
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
