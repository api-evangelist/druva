components:
  schemas:
    VMwareRestoreExecutionDetailsStruct:
      description: RestoreExecutionDetailsStruct struct holds the response for GetRestoreJobsReport api
      type: object
      properties:
        bandwidthConsumed:
          description: Specifies the bit rate to transfer data from the Cloud and CloudCache.
          type: string
          x-go-name: BandwidthConsumed
        bandwidthConsumedInKBps:
          description: Specifies the bit rate in Kilobytes per second to transfer data from the Cloud and CloudCache.
          type: number
          format: double
          x-go-name: BandwidthConsumedInKBps
        errorCode:
          description: "Specifies the error code for the failed jobs. The possible values are:\n \\\"0\\\": If the job is successful\n<error_number>: If the job has failed"
          type: string
          x-go-name: ErrorCode
        errorMessage:
          description: Specifies the error message for the failed jobs. This field is empty if the job is successful.
          type: string
          x-go-name: ErrorMsg
        endTime:
          description: The time when the job operation ends.
          type: string
          x-go-name: EndTime
        restoredData:
          description: Specifies the total amount of data restored.
          type: string
          x-go-name: RestoredData
        restoredDataInBytes:
          description: Specifies the total amount of data restored in bytes.
          type: integer
          format: uint64
          x-go-name: RestoredDataInBytes
        restoredItems:
          description: Data items restored.
          type: string
          x-go-name: RestoredItems
        startTime:
          description: The time when the job operation starts.
          type: string
          x-go-name: StartTime
        status:
          description: Status of the job.
          type: string
          x-go-name: Status
      x-go-name: RestoreExecutionDetailsStruct
      x-go-package: phoenix/vmware/cloud/report/spec/jobs
    VMwareGetAllRestoreJobsInfoResponse:
      description: GetAllRestoreJobsInfoResponse is the response schema for GetRestoreJobReport
      type: object
      properties:
        jobs:
          description: List of all restore jobs run for VMware.
          type: array
          items:
            $ref: '#/components/schemas/VMwareGetRestoreJobsReport'
          x-go-name: Jobs
        nextPageToken:
          description: The token to access the next page of results. This parameter will be empty for the last page of results.
          type: string
          x-go-name: OutToken
      x-go-name: GetAllRestoreJobsInfoResponse
      x-go-package: phoenix/vmware/cloud/report/spec/jobs
    VMwareMSSqlConfigDetails:
      description: MSSqlConfigDetails struct holds the response for GetPolicies api
      type: object
      properties:
        backupTransactionLog:
          description: Specifies the option to enable transaction log backups for applications.
          type: boolean
          x-go-name: BackupTransactionLog
        tlBackupFrequencyInMinutes:
          description: Specifies the interval in minutes to run the transaction log backups.
