            details:
              initiatorType: ADMIN
              initiatorId: '221'
              initiatorName: initator@admin.com
              adminId: '109'
              oldState: null
              newState:
                email: email@example.com
                firstName: John
                lastName: Smith
                phone: '12345678910'
                role: 2
                lastLogin: '0001-01-01T00:00:00Z'
                creatorAdminId: 1
                isActive: true
            feature: Admin
            globalID: MSP:c8b3866b-aa9e-4a87-a316-133214f7d23f
            timeStamp: 1709208497
            syslogFacility: 14
            syslogSeverity: 6
            type: AdminCreated
          - category: ALERT
