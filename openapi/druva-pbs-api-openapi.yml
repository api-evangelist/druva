        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
components:
  schemas:
    PBSExecutionDetailsStruct:
      type: object
      title: 'ExecutionDetailsStruct : Execution details of the job.'
      properties:
        endTime:
          description: The time when the job completes. The time is specified in the UTC timezone. The format is YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: EndTime
        errorCode:
          description: 'The error code for the failed jobs. The possible values are:\n\"0\": If the job is successful\n<error_number>: If the job has failed'
          type: string
          x-go-name: ErrorCode
        errorMessage:
          description: The error message for the failed jobs. This field is empty if the job is successful.
          type: string
          x-go-name: ErrorMsg
        scheduleTime:
          description: The date and time when the job starts or is scheduled to start. The time is specified in UTC in the format YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: ScheduleTime
        startTime:
          description: The time when the job starts. The time is specified in the UTC timezone. The format is YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: StartTime
        status:
          description: 'The status of the job. Status can be one of the following values: Queued, Running, Successful, Successful with errors and Failed.'
          type: string
          x-go-name: Status
      x-go-name: ExecutionDetailsStruct
      x-go-package: phoenix/pbs/cloud/report/spec/jobs
    PBSGetUploadLogJobReportResponse:
      description: GetUploadLogJobReportResponse is the response schema for GetUploadLogJobReport
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/PBSGetUploadLogJobsReport'
          x-go-name: Jobs
        nextPageToken:
          description: The page token value for the next set of API results. The value of this parameter is NULL for the last set of results.
          type: string
          x-go-name: OutToken
      x-go-name: GetUploadLogJobReportResponse
      x-go-package: phoenix/pbs/cloud/report/spec/jobs
    PBSLastBackupDetailsStruct:
      description: LastBackupDetailsStruct is response schema for GetBackupsets
      type: object
      properties:
        jobID:
          description: The unique identification number associated with the job. This parameter will be skipped if the value is NULL.
          type: integer
          format: int32
          x-go-name: JobID
        status:
          description: 'The status of the job. This parameter can be one from the following values: Queued, Running, Successful, Successful with errors and Failed.'
          type: string
          x-go-name: Status
      x-go-name: LastBackupDetailsStruct
      x-go-package: phoenix/pbs/cloud/report/spec/backupsets
    PBSGetAllJobsReport:
      description: GetAllJobsReport struct holds the response for GetAllJobsReport API
      type: object
      properties:
        endTime:
          description: The time when the job completes. The time is specified in the UTC timezone. The format is YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: EndTime
        errorCode:
          description: 'The error code for the failed jobs. The possible values are:\n \"0\": If the job is successful\n<error_number>: If the job has failed'
          type: string
          x-go-name: ErrorCode
        errorMessage:
          description: The error message for the failed jobs. This field is empty if the job is successful.
          type: string
          x-go-name: ErrorMsg
        jobID:
          description: The unique identification number associated with the job.
          type: integer
          format: int32
          x-go-name: JobID
        jobType:
          description: 'The type of the job. JobType can be one of the following values: Backup, Restore and Log Request.'
          type: string
          x-go-name: JobType
        organizationID:
          description: The ID of the organization
          type: integer
          format: int32
          x-go-name: OrgID
        organizationName:
          description: The name of the organization in which the Phoenix Backup Store is deployed.
          type: string
          x-go-name: OrgName
        scheduleTime:
          description: The date and time when the job starts or is scheduled to start. The time is specified in UTC in the format YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: ScheduleTime
        serverName:
          description: The name of the Oracle server host or the Phoenix Backup Store.
          type: string
          x-go-name: ServerName
        startTime:
          description: The time when the job starts. The time is specified in the UTC timezone. The format is YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: StartTime
        status:
          description: 'The status of the job. Status can be one of the following values: Queued, Running, Successful, Successful with errors and Failed.'
          type: string
          x-go-name: Status
      x-go-name: GetAllJobsReport
      x-go-package: phoenix/pbs/cloud/report/spec/jobs
    PBSUploadLogExecDetailsStruct:
      description: UploadLogExecDetailsStruct struct holds the response for GetUploadLogJobsReport api
      type: object
      properties:
        endTime:
          description: The time when the job completes. The time is specified in the UTC timezone. The format is YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: EndTime
        errorCode:
          description: 'The error code for the failed jobs. The possible values are:\n\"0\": If the job is successful\n<error_number>: If the job has failed'
          type: string
          x-go-name: ErrorCode
        errorMessage:
          description: The error message for the failed jobs. This field is empty if the job is successful.
          type: string
          x-go-name: ErrorMsg
        logsExpiryTime:
          description: The expiry time of the uploaded logs. The time is specified in the UTC time zone. The format is YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: LogsExpiryTime
        logsSize:
          description: The size of the logs.
          type: string
          x-go-name: LogsSize
        logsSizeInBytes:
          description: The size of the logs in bytes.
          type: integer
          format: uint64
          x-go-name: LogsSizeInBytes
        sourceJobID:
          description: The ID of the job of the source Oracle server host for which logs are requested.
          type: integer
          format: int32
          x-go-name: SourceJobID
        sourceJobType:
          description: The job type of the source Oracle server host for which logs are requested.
          type: string
          x-go-name: SourceJobLogType
        scheduleTime:
          description: The date and time when the job starts or is scheduled to start. The time is specified in UTC in the format YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: ScheduleTime
        startTime:
          description: The time when the job starts. The time is specified in the UTC timezone. The format is YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: StartTime
        status:
          description: 'The status of the job. Status can be one of the following values: Queued, Running, Successful, Successful with errors and Failed.'
          type: string
          x-go-name: Status
      x-go-name: UploadLogExecDetailsStruct
      x-go-package: phoenix/pbs/cloud/report/spec/jobs
    PBSGetRestoreJobsReport:
      description: GetRestoreJobsReport struct holds the response for GetRestoreJobsReport api
      type: object
      properties:
        backupMountName:
          description: The RMAN target location where the Oracle RMAN backups are stored.
          type: string
          x-go-name: BackupMountName
        backupsetID:
          description: The ID of the backup set.
          type: integer
          format: int32
          x-go-name: BackupsetID
        destServerName:
          description: The name of the Oracle server host or the Phoenix Backup Store to which the restore was initiated.
          type: string
          x-go-name: DestServerName
        environmentDetails:
          $ref: '#/components/schemas/PBSRestoreEnvironmentStruct'
        executionDetails:
          $ref: '#/components/schemas/PBSRestoreExecutionDetailsStruct'
        jobID:
          description: The unique identification number associated with the job.
          type: integer
          format: int32
          x-go-name: JobID
        jobType:
          description: The type of the job. In this case it is Restore.
          type: string
          x-go-name: JobType
        organizationID:
          description: The ID of the organization
          type: integer
          format: int32
          x-go-name: OrgID
        organizationName:
          description: The name of the organization in which the Phoenix Backup Store is deployed.
          type: string
          x-go-name: OrgName
        sourceServerName:
          description: The name of the Oracle server host or the Phoenix Backup Store on which the backup was initiated.
          type: string
          x-go-name: SourceServerName
      x-go-name: GetRestoreJobsReport
      x-go-package: phoenix/pbs/cloud/report/spec/jobs
    PBSBackupsetInfo:
      description: BackupsetInfo is response schema for GetBackupsets
      type: object
      properties:
        backupEnabled:
          description: Specifies whether the backup is enabled for the backup set.
          type: boolean
          x-go-name: BackupEnabled
        backupsetID:
          description: The ID of the backup set.
          type: integer
          format: int32
          x-go-name: BackupsetID
        backupMountName:
          description: The RMAN target location where the Oracle RMAN backups are stored.
          type: string
          x-go-name: BackupMountName
        dataLock:
          description: The status indicating if Data Lock is enabled for the backup set
          type: boolean
          x-go-name: Immutability
        ipWhitelist:
          description: The list of IP addresses of the Oracle RMAN hosts that can store Oracle RMAN backups on the mount. If the IP whitelist is not set to *, it displays the list of allowed IP addresses. For more information, see IPWhitelist.
          type: string
          x-go-name: IPWhitelist
        lastBackupDetails:
          $ref: '#/components/schemas/PBSLastBackupDetailsStruct'
        maxBandwidth:
          description: The maximum bandwidth that each server can consume while backing up data to the Cloud.
          type: integer
          format: int32
          x-go-name: MaxBandwidth
        organizationID:
          description: The ID of the organization
          type: integer
          format: int32
          x-go-name: OrgID
        organizationName:
          description: The name of the organization in which the Phoenix Backup Store is deployed.
          type: string
          x-go-name: OrgName
        resourceType:
          description: 'The Resource type which in this case is for Phoenix Backup Store : Oracle.'
          type: string
          x-go-name: ResourceType
        oracleStoreID:
          description: The ID of the Oracle Store
          type: integer
          format: int32
          x-go-name: OracleStoreID
        serverName:
          description: The name of the Oracle server host or the Phoenix Backup Store.
          type: string
          x-go-name: ServerName
        storageId:
          description: The unique identification number associated with the storage region.
          type: integer
          format: int32
          x-go-name: StorageID
        storageName:
          description: The name of the storage region where the snapshot is stored after the Phoenix Backup Store uploads the snapshot to the Druva Cloud.
