openapi: 3.2.0
info:
  version: '3.0'
  title: Enterprise Workloads PBS API
servers:
- url: //apis.druva.com/phoenix
tags:
- name: PBS
paths:
  /pbs/v1/orgs/{OrgID}/reports/backupsets:
    get:
      description: Returns all backupsets for Phoenix Backup Stores.
      tags:
      - PBS
      summary: List all backupsets
      operationId: PBSGetBackupsetsRequest
      security:
      - Bearer: []
      parameters:
      - description: The ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: ServerName
        description: The name of the Oracle server host or the Phoenix Backup Store. Specify multiple server names by separating them with commas.
        name: serverName
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - x-go-name: BackupEnabled
        description: Specifies whether the backup is enabled for the backup set. Select 'true' if the backup is enabled for the backup set.
        name: backupEnabled
        in: query
        schema:
          type: boolean
      - x-go-name: PageToken
        description: The token to access the next page of results. Keep this field blank in the first request. Use the token value received in the previous response's parameter 'nextPageToken'.
        name: pageToken
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PBSGetBackupsetsResponse'
        '400':
          description: Bad Request
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /pbs/v1/orgs/{OrgID}/reports/backupstores:
    get:
      description: Returns all backupstores
      tags:
      - PBS
      summary: List all backupstores
      operationId: PBSListBackupstoreRequest
      security:
      - Bearer: []
      parameters:
      - description: The ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: ServerName
        description: The name of the Oracle server host or the Phoenix Backup Store. Specify multiple server names by separating them with commas.
        name: serverName
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - x-go-name: PageToken
        description: The token to access the next page of results. Keep this field blank in the first request. Use the token value received in the previous response's parameter 'nextPageToken'.
        name: pageToken
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PBSBackupstoreResponse'
        '400':
          description: Bad Request
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /pbs/v1/orgs/{OrgID}/reports/jobs:
    get:
      description: Returns all jobs for Phoenix Backup Stores.
      tags:
      - PBS
      summary: List all jobs
      operationId: PBSGetAllJobsReportRequest
      security:
      - Bearer: []
      parameters:
      - description: The ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: JobType
        description: 'The type of the job. This parameter can be set to one or more of the following values: Backup, Restore and Log Request. Specify multiple job types by separating them with commas. See <a href=https://help.druva.com/en/articles/8651604-view-oracle-jobs>Job Types.</a>'
        name: jobType
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - x-go-name: ServerName
        description: The name of the Oracle server host or the Phoenix Backup Store. Specify multiple server names by separating them with commas.
        name: serverName
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - x-go-name: Status
        description: 'The status of the job. This parameter can be set to one or more of the following values: Queued, Running, Successful, Successful with errors and Failed. Specify multiple status values by separating them with commas.'
        name: status
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - x-go-name: StartTime
        description: The date and time to filter jobs that were run after the specified timestamp. Specify the date and time in UTC format and the timestamp must be greater than the value of (current time - 6 months). The format is YYYY-MM-DDTHH:MM:SSZ.
        name: fromTime
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: EndTime
        description: The date and time to filter jobs that were run until the specified timestamp. Specify the date and time in UTC format. The format is YYYY-MM-DDTHH:MM:SSZ.
        name: toTime
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: SortOrder
        description: Sort the API results by the scheduled time of the job, either in ascending or descending order. Set the sortOrder value to ASC or DESC. The default value is ASC.
        name: sortOrder
        in: query
        schema:
          type: string
      - x-go-name: PageToken
        description: The token to access the next page of results. Keep this field blank in the first request. Use the token value received in the previous response's parameter 'nextPageToken'.
        name: pageToken
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PBSGetAllJobsReportResponse'
        '400':
          description: Bad Request
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
