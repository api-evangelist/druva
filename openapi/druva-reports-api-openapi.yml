  /reporting/{version}/reports/{reportID}:
    post:
      tags:
      - Reports
      summary: Get Report
      description: Returns the selected report. Use the report ID field to specify the report that you want to fetch. By default the report provides the data for last 24 hours if no date/time filters are selected. For more information, see guides on the Reports API.
      operationId: GetReportDataRequest
      parameters:
