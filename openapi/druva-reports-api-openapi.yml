  /msp/reporting/v2/reports/quotaItemized:
    post:
      tags:
      - Reports
      summary: Get Itemized Tenant Quota Report v2.0
      description: '⚠ **Warning**: This API version will be deprecated on August 28, 2026.

        Upgrade to v3 API now to experience enhanced functionality and performance.

        Returns a detailed, daily, report on the quota usage by MSP tenants. It displays consumption based on the currently active quota.

        If there is no active quota defined, the report will show consumption from the last active quota.

        If the quota that needs to be reported is set to 0, it will be excluded from the report.'
      operationId: GetTenantQuotaV2ItemizedV2
      parameters:
      - name: Authorization
        description: Specify the Bearer access token
        schema:
          type: string
        in: header
        required: true
      requestBody:
        description: "Specify the desired page size or filters to be applied to generate a report on the quota usage by MSP tenants. \n :fa-info-circle: Sorting is currently not available for columns."
