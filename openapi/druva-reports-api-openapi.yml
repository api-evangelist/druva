openapi: 3.2.0
info:
  title: Druva Reports API
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Reports across 3 of this provider''s published API definitions: druva-cloudranger-openapi-original.json, druva-msp-openapi-original.json, druva-platform-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cloudranger.com/202004
- url: https://apis.druva.com/
- url: https://apis.druva.com/platform
tags:
- name: Reports
paths:
  /organizations/{organization_id}/reports:
    post:
      description: Generate a CloudRanger report. This will initiate a report. To check if the report has finished generating perform a GET call using the report_id returned in the response from this request and check if the status is 'complete'.
      parameters:
      - description: Organization Id of the Organization that you are working with. This can be found by looking at the organization id in the URL of the dashboard. These are randomly generated alphanumber values
        in: path
        name: organization_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostOrganizationsReportsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostOrganizationsReportsResponse'
          description: 200 response
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/empty'
          description: 201 response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 401 response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 403 response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 404 response
      security:
      - API_Authorizer: []
        api_key: []
      summary: Generate a CloudRanger report
      tags:
      - Reports
      operationId: postOrganizationsByOrganizationIdReports
      x-operation-id-source: derived
    servers:
    - url: https://api.cloudranger.com/202004
  /organizations/{organization_id}/reports/{report_id}:
    get:
      description: Returns information about a generated CloudRanger report. This route can be used to check the status of a newly generated Report
      parameters:
      - description: Organization Id of the Organization that you are working with. This can be found by looking at the organization id in the URL of the dashboard. These are randomly generated alphanumber values
        in: path
        name: organization_id
        required: true
        schema:
          type: string
      - description: The report identifier which can be used to return information about a report which has been generated within your organization. You can get all report_ids by using the GET call /organizations/:organization_id/reports which will return all of the report which have been generated within your organization
        in: path
        name: report_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationsReportsByIdResponse'
          description: 200 response
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/empty'
          description: 201 response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 401 response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 403 response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 404 response
      security:
      - API_Authorizer: []
        api_key: []
      summary: Get information for a generated CloudRanger report
      tags:
      - Reports
      operationId: getOrganizationsByOrganizationIdReportsByReportId
      x-operation-id-source: derived
    servers:
    - url: https://api.cloudranger.com/202004
  /organizations/{organization_id}/reports/{report_id}/download:
    get:
      description: Returns an AWS S3 signed url for the generated CloudRanger report. This url will expire after one week. As it takes some time to generate a report it is recommended to poll this route '/organizations/{organization_id}/reports/{report_id}' periodically until the status of the report is complete. Then this download route can be used to get the signed url
      parameters:
      - description: Organization Id of the Organization that you are working with. This can be found by looking at the organization id in the URL of the dashboard. These are randomly generated alphanumber values
        in: path
        name: organization_id
        required: true
        schema:
          type: string
      - description: The report identifier which can be used to return information about a report which has been generated within your organization. You can get all report_ids by using the GET call /organizations/:organization_id/reports which will return all of the report which have been generated within your organization
        in: path
        name: report_id
        required: true
        schema:
          type: string
      - description: format
        in: query
        name: format
        required: true
        schema:
          enum:
          - pdf
          - csv
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationsReportsDownloadResponse'
          description: 200 response
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/empty'
          description: 201 response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 401 response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 403 response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 404 response
      security:
      - API_Authorizer: []
        api_key: []
      summary: Get S3 signed url in order to download the CloudRanger report file
      tags:
      - Reports
      operationId: getOrganizationsByOrganizationIdReportsByReportIdDownload
      x-operation-id-source: derived
    servers:
    - url: https://api.cloudranger.com/202004
