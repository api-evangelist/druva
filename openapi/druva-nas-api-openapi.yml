openapi: 3.2.0
info:
  title: Druva NAS API
  version: '1.0'
  description: 'Operations tagged NAS across 3 of this provider''s published API definitions: druva-enterprise-workloads-openapi-original.json, druva-job-management-cloud-openapi-original.json, druva-job-management-govcloud-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: //apis.druva.com/phoenix
- url: //apis.druva.com/unity
- url: //govapis.druva.com/unity
tags:
- name: NAS
paths:
  /storageconfig/v2/csets/{csetID}/snapshots:
    get:
      description: List snapshots for the specified backup set.
      tags:
      - NAS
      summary: List all snapshots
      operationId: ListSnapshots
      parameters:
      - x-go-name: AuthHeader
        description: Specify atleast one authentication token.
        name: X-Drv-Product-Jwt
        in: header
        required: true
        schema:
          type: string
      - x-go-name: AuthEntities
        name: authEntities
        description: 'Specify the authorization information. It should be in the format: "pType=org;pID=orgID", where orgID is the ID of your organization.'
        in: header
        required: true
        schema:
          type: string
      - x-go-name: CSetID
        name: csetID
        description: Specify the csetID of the corresponding backup set.
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: SnapshotTypes
        name: snapshotTypes
        description: 'Specify the type of snapshot. The possible values for the snapshot type are: "HOT", "WARM", and "COLD". Specify multiple snapshot types by separating the values with commas. Available values: HOT, WARM, COLD'
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - x-go-name: FromTime
        name: fromTime
        description: Specify a date and time in the UTC format YYYY-MM-DD THH:MM:SSZ to display all snapshots created after this date and time.
        in: query
        schema:
          type: string
      - x-go-name: ToTime
        name: toTime
        description: Specify a date and time in the UTC format YYYY-MM-DD THH:MM:SSZ to display all snapshots created before this date and time.
        in: query
        schema:
          type: string
      - x-go-name: SortBy
        name: sortBy
        description: 'Sort the returned snapshots in ascending or descending order of the snapshot creation time. Set it to "ASC" or "DESC" to sort the list in ascending or descending order. The default value is DESC. '
        in: query
        schema:
          type: string
          default: DESC
      - x-go-name: PageSize
        name: pageSize
        description: Specify the number of records that must be displayed on a page.
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: PageToken
        name: pageToken
        description: Specify the token to access the next page of results. Keep this field blank in the first request. Use the token value received in the previous response's parameter 'nextPageToken'.
        in: query
        schema:
          type: string
      - x-go-name: UseCtime
        name: useCtime
        description: The parameter indicating whether the time is displayed in Epoch or CTime format.
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: The list of all snapshots.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListSnapshotsResponse'
        '400':
          description: Bad Request
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
    servers:
    - url: //apis.druva.com/phoenix
  /nas/v1/orgs/{OrgID}/reports/backupsets:
    get:
      description: Returns a list of all backup sets for NAS hosts.
      tags:
      - NAS
      summary: List all backup sets
      operationId: NASGetBackupsetsRequest
      security:
      - Bearer: []
      parameters:
      - description: Specify the organization ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: HostName
        description: Specify the host name. You can specify multiple host names by separating them with commas. Get the list of the NAS host names using the 'ListHost' API.
        name: hostName
        in: query
        schema:
          type: string
      - x-go-name: ProxyName
        description: Specify the proxy name. You can specify multiple proxy names by separating them with commas. (This is deprecated)
        name: proxyName (deprecated)
        in: query
        schema:
          type: string
      - x-go-name: PoolName
        description: Specify the pool name. You can specify multiple pool names by separating them with commas.
        name: poolName
        in: query
        schema:
          type: string
      - x-go-name: BackupEnable
        description: Specify whether the backup is enabled for the backup set. Set the value to 'true' if the backup is enabled for the backup set, else set it to 'false'.
        name: backupEnable
        in: query
        schema:
          type: boolean
      - x-go-name: PageToken
        description: Specify the token to access the next page of results. Keep this field blank in the first request. Use the token value received in the previous response's parameter 'nextPageToken'.
        name: pageToken
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NASGetBackupsetsResponse'
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or the authentication token was expired.
        '403':
          description: Forbidden
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
    servers:
    - url: //apis.druva.com/phoenix
