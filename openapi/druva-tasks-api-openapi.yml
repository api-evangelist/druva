        description: 'Filter Object containing  keys that can be one or more OPTIONAL values which must be an array of strings. For EG: {"region":["ca-west-1","us-east-1"],"account_id":["hmzGN2gY","i8bMxmkB"],"created_at":"2025-12-24T13:59:30Z"} depending on the type. if type is backup, filter :[account_id, action, air_gap, created_at, generated_by, is_success, object_id, region, resource_type], if type is restore, filter :[account_id, action, air_gap, created_at, is_success, region, resource_type], if type is retention or  disasterrecovery, filter :[account_id, action, created_at, is_success, object_id, region, resource_type], if type is scheduling, filter :[account_id, action, created_at, is_success, object_id, region, resource_type, all-schedules].'
        required: true
        schema:
          type: string
      - description: The number of records to be returned for a single page for the request.
        in: query
