              type: string
              description: Name of resource for which restore job is created in inSync or Phoenix.
              example: Ernie Carter's Macbook
            resourceType:
              type: string
              description: Type of resource for which restore job is created in inSync or Phoenix.
              example: Endpoint
            resourceParentName:
              type: string
              description: Name of the device user in case of a device or Server Name in case of a backup set which is quarantined. Example - Ernie Carter
              example: Ernie Carter
            platformType:
              type: string
              description: ''
              example: ''
            addTime:
              type: string
              description: Creation time of Curated Snapdhot job.
              example: '2021-04-12T09:33:55Z'
            endTime:
              type: string
              description: Completion time of Curated Snapdhot job.
              example: '2021-04-12T09:35:15Z'
            jobType:
              type: string
              example: Synthetic Snapshot
              description: Type of job.
            statusCode:
              type: integer
              description: Status code for Curated Snapshot job.
              example: 3
            status:
              type: string
              description: Status for Curated Snapshot job.
              example: Failed
            resourceURL:
              type: string
              description: Link to resource for which Curated Snapshot job is executed.
              example: ''
            restoreURL:
              type: string
              description: Link to resource for which Curated Snapshot job is executed.
              example: ''
            error:
              type: object
              properties:
                errorCode:
                  type: string
                  example: ''
                  description: Code of the error seen while Curated Snapshot job is in progress.
                errorMessage:
                  type: string
                  example: ''
                  description: Message of the error seen while Curated Snapshot job is in progress.
                errorDescription:
                  type: string
                  example: ''
                  description: Provides details of the error encountered when the Curated Snapshot job is in progress.
            useLightScan:
              type: boolean
              description: Boolean flag to denote if Quick Scan was enabled for Curated Snapshot.
              example: true
        snapshot:
          type: object
          properties:
            jobID:
              type: string
              description: ID of Curated Snapshot Job.
              example: 1
            ssRangeStartDate:
              type: string
              format: date
              description: Start date from which snapshots are considered for creation of Curated Snapshot
              example: '2020-10-25T00:00:00Z'
            ssRangeEndDate:
              type: string
              format: date
              description: End date till when snapshots are considered for creation of Curated Snapshot
              example: 2020-10-29T:23:59:59Z
            expiry:
              type: string
              format: date
              description: Date till when Curated Snapshot is retained.
              example: 2020-11-28T:23:59:59Z
            enableAVScan:
              type: boolean
              example: true
              description: Flag stating if AV Scan is enabled while creating Curated Snapshot. This is always True
            excludeFileHashes:
              type: boolean
              example: true
              description: Flag stating if File Hash Scan is enabled while creating Curated Snapshot. This is always True
            excludeFileExtentions:
              type: boolean
              example: true
              description: Boolean flag to include files extensions for exclusion based on the added extensions.
            fileExtentions:
              type: array
              items:
                type: string
                example: .txt
            replaceExistingSnapshot:
              type: boolean
              example: true
              description: Flag to decide if existing Curated Snapshot should be replaced by a newer one.
            virtualSnapshotID:
              type: string
              description: Base-64 encoded name of Curated Snapshot created by the job.
              example: dmlydHVhbF9Nb24gQXVnIDMwIDA2OjQxOjE3IDIwMjE=
            virtualSnapshotIDEpoch:
              type: integer
              description: Epoch timestamp of Curated Snapshot created by the job.
              example: 129080982
            virtualSnapshotName:
              type: string
              description: Storage name of Curated Snapshot created by the job.
              example: virtual_Mon Aug 30 06:41:17 2021
            displaySnapshotName:
              type: string
              description: Display name of Curated Snapshot created by the job.
              example: Aug 30, 2021 06:41
            size:
              type: integer
              description: Size of Curated Snapshot created in bytes.
              example: 10240
            statusCode:
              type: integer
              description: Status code for Curated Snapshot job.
              example: 1
            status:
              type: string
              description: Status for Curated Snapshot job.
              example: Failed
            filesIncluded:
              type: integer
              description: Files included in Curated Snapshot.
              example: 100
            filesScanSkipped:
              type: integer
              description: Files skipped from scan by Scan Engine
              example: 1
            filesExcluded:
              type: integer
              description: Files excluded with extension exclusion from Curated Snapshot by Scan Engine.
              example: 5
            filesBlocked:
              type: integer
              description: Files blocked be Scan service while creating Curated Snapshot.
              example: 5
            filesEncrypted:
              type: integer
              description: Files excluded from Curated Snapshot as they were found to be encrypted.
              example: 5
            scanSkipBeyondStartDate:
              type: boolean
              description: Boolean flag used to denote if the scan is skipped for files modified before the start date of the snapshot range.
              example: true
            maxScanFileSizeLimitInMB:
              type: integer
              description: Integer value used to denote the maximum file size limit in MB (between 100 to 1024) for Curated Snapshot creation.
              example: 100
