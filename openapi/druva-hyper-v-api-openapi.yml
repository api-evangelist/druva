components:
  schemas:
    HVHyperVHost:
      description: HyperVHost is the response schema for HyperV FLR Proxies
      type: object
      properties:
        connectionStatus:
          description: The connection status of the host.
          type: string
          x-go-name: ConnectionStatus
        name:
          description: The name of the host.
          type: string
          x-go-name: Name
        os:
          description: The operating system of the host.
          type: string
          x-go-name: OS
        osVersion:
          description: The version of the operating system of the hosts.
          type: string
          x-go-name: OSVersion
      x-go-name: HyperVHost
      x-go-package: phoenix/hyperv/cloud/report/spec/host
    HVGetBackupPoliciesReportResponse:
      type: object
      title: GetBackupPoliciesReportResponse returns a list of all backup sets for Hyper-V.
      properties:
        nextPageToken:
          description: The token to access the next page of results. This parameter will be empty for the last page of results.
          type: string
          x-go-name: OutToken
        policies:
          description: List of Hyper-V policies
          type: array
          items:
            $ref: '#/components/schemas/HVHyperVPolicies'
          x-go-name: Policies
      x-go-name: GetBackupPoliciesReportResponse
      x-go-package: phoenix/hyperv/cloud/report/spec/policy
    HVGetBackupSetReportResponse:
      description: GetBackupSetReportResponse is the response schema for HyperVBackupSets
      type: object
      properties:
        backupsets:
          description: Returns a list of all Hyper-V backup sets.
          type: array
          items:
            $ref: '#/components/schemas/HVHyperVBackupSets'
          x-go-name: BackupSets
        nextPageToken:
          description: The token to access the next page of results. This parameter will be empty for the last page of results.
          type: string
          x-go-name: OutToken
      x-go-name: GetBackupSetReportResponse
      x-go-package: phoenix/hyperv/cloud/report/spec/backupset
    HVGetUploadLogJobReportResponse:
      type: object
      title: GetUploadLogJobReportResponse returns a list of all upload logs jobs run for Hyper-V.
      properties:
        jobs:
          description: List of all upload logs jobs run for Hyper-V.
          type: array
          items:
            $ref: '#/components/schemas/HVHyperVUploadJob'
          x-go-name: Jobs
        nextPageToken:
          description: The token to access the next page of results. This parameter will be empty for the last page of results.
          type: string
          x-go-name: OutToken
      x-go-name: GetUploadLogJobReportResponse
      x-go-package: phoenix/hyperv/cloud/report/spec/job
    HVHyperVAllJob:
      type: object
      title: HyperVAllJob is the response schema for Hyper-V utils.
      properties:
        clusterName:
          description: The name of Cluster
          type: string
          x-go-name: ClusterName
        endTime:
          description: The time when the job operation ends. The time is specified in the UTC time zone. The format is YYYY-MM-DDTHH:MM:SSZ.
          type: string
          x-go-name: EndTime
        errorCode:
          description: 'Specifies the error code when the backup operation fails. The possible values are:\n \"0\": If the job is successful\n <error_number>: If the job has failed'
          type: string
          x-go-name: ErrorCode
        errorMessage:
          description: Specifies the message for rhe failed job. This field is empty if the job is successful.
          type: string
          x-go-name: ErrorMsg
        host:
          description: The name of the Hyper-V host. Multiple host names can be separated by commas. Get the list of the Hyper-V host names using the 'ListHost' API.
          type: string
          x-go-name: Host
        jobID:
          description: Specifies a unique identification number associated with the job.
          type: integer
          format: int32
          x-go-name: JobID
        jobType:
          description: 'Specifies the type of the job. This parameter can be set to one or more of the following values: Backup, Restore, Log Request and Defreeze. Specify multiple job types by separating them with commas. See <a href=https://help.druva.com/en/articles/8651316-monitor-hyper-v-jobs>Job Types.</a>'
          type: string
          x-go-name: JobType
        organizationName:
          description: The name of the organization.
          type: string
          x-go-name: OrganizationName
        scvmmName:
          description: The name of System Center Virtual Machine Manager(SCVMM).
          type: string
