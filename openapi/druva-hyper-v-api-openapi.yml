  /hyperv/v1/orgs/{OrgID}/reports/jobs:
    get:
      description: Returns a list of all jobs for Hyper-V.
      tags:
      - Hyper-V
      summary: List all jobs
      operationId: HVGetAllJobsReportRequest
      parameters:
      - description: Specify the organization ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: JobType
        description: 'Specify the type of the job. This parameter can be set to one or more of the following values: Backup, Restore, Log Request and Defreeze. Specify multiple job types by separating them with commas. See <a href=https://help.druva.com/en/articles/8651316-monitor-hyper-v-jobs>Job Types.</a>'
        name: jobType
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - x-go-name: Status
        description: 'Specify the status of the job. This parameter can be set to one or more of the following values: Queued, Running, Successful, Successful with errors and Failed. Specify multiple status values by separating them with commas.'
        name: status
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - x-go-name: PageToken
        description: Specify the token to access the next page of results. Keep this field blank in the first request. Use the token value received in the previous response's parameter 'nextPageToken'.
        name: pageToken
        in: query
        schema:
          type: string
      - x-go-name: VMName
        description: The name of the virtual machine (VM) for which the job has been initiated. Specify multiple VM names by separating them with commas.
        name: vmName
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - x-go-name: HostName
        description: The name of the Hyper-V host on which the FLR proxy is deployed. Multiple host names can be separated by commas.
        name: hostName
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - x-go-name: StartTime
        description: Specify the date and time to filter jobs that were run during the specified timestamp. Specify the date and time in UTC format (YYYY-MM-DDTHH:MM:SSZ). The timestamp must be within six months from the current date. For example, if the current date is 2020-10-02, you can specify any date between 2020-04-03 to 2020-10-02.
        name: fromTime
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: EndTime
        description: Specify a time to filter jobs that were run before it. The time should be specified in the UTC format and must be lesser than the current date. The format is YYYY-MM-DDTHH:MM:SSZ.
        name: toTime
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: SortOrder
        description: Sort the API results by the scheduled time of the job, either in ascending or descending order. Set the sortOrder value to ASC or DESC. The default value is ASC.
        name: sortOrder
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/HVGetAllJobsReportResponse'
        '400':
