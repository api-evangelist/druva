          description: The email address of the user. Example - ernie.carter@druva.com
          example: ernie.carter@druva.com
        userName:
          type: string
          description: The username of the user in inSync. Example - Ernie Carter
          example: Ernie Carter
        deviceName:
          type: string
          description: The device name linked to the user in inSync.
          example: Ernie Carter's Macbook
        deviceIdentifierType:
          type: string
          description: The unique id type of the device in inSync. Example - Serial Number
          example: Serial Number
        deviceIdentifier:
          type: string
          description: 'The unique id of the device in inSync. Example - Po3XF '
          example: Po3XF
        oldDeviceName:
          type: string
          description: The old device name linked to the user in inSync. Example - Ernie Carter's Old Macbook
          example: Ernie Carter's Old Macbook
        restoreData:
          type: string
          description: The type of data restore performed on the new device. Example - SYSTEM
          example: SYSTEM
        createdTime:
          type: string
          format: date-time
          description: The date and time when the device mapping was created. Example - 2019-10-25T00:00:00Z
          example: '2019-10-25T00:00:00Z'
    HTTP_403:
      type: object
      properties:
        code:
          type: string
          example: InsyncAdmanagement-1221
          description: Application specific error code
        message:
          type: string
          example: Access restricted due to insufficient permissions.
          description: Application specific error message
        retryable:
          type: boolean
          example: false
          description: If true, retry using exponential backoff
        data:
          type: object
          description: Dictionary of values present in the error message for localization. Currently, no values are available.
