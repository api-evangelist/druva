  /endpoints/v1/backups:
    get:
      tags:
      - Endpoints
      summary: List endpoint backups
      description: Returns the details of last successful backups of all user devices.
      security:
      - Bearer: []
      parameters:
      - name: lastSuccessful
        in: query
        required: true
        description: "Provides details of the last successful backup for a device. \n Currently, only 'True' is the supported value for this parameter."
        schema:
          type: boolean
          enum:
          - 'true'
      - name: deviceID
        in: query
        description: 'Filter to get list of last successful backups for a particular device using its unique ID. Get the ID of a device using the ‘List all devices’ API. '
        required: false
        schema:
          type: integer
      - name: userID
        in: query
        description: Filter to get list of last successful backups on devices owned by a particular user using their user ID. Get the ID of a user using the ‘List all users’ API.
        required: false
        schema:
          type: integer
      - name: pageToken
        in: query
        description: The token to access the next page of results. Use the token value received in the previous response's parameter 'nextPageToken'.
        required: false
        schema:
          type: string
      - name: minBackupStartTime
        in: query
        description: Filter to list successful backups that started after a particular date and time. Format - YYYY-MM-DDTHH:MM:SSZ
        required: false
        schema:
          type: string
          format: date-time
      - name: maxBackupStartTime
        in: query
        description: Filter to list successful backups that started before a particular date and time. Format - YYYY-MM-DDTHH:MM:SSZ
        required: false
        schema:
          type: string
          format: date-time
      - name: minBackupEndTime
        in: query
        description: Filter to list successful backups that ended after a particular date and time. Format - YYYY-MM-DDTHH:MM:SSZ
        required: false
        schema:
          type: string
          format: date-time
      - name: maxBackupEndTime
        in: query
        description: Filter to list successful backups that ended before a particular date and time. Format - YYYY-MM-DDTHH:MM:SSZ
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupList'
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or an expired authentication token was supplied.
        '403':
          description: 'Access denied: Insufficient permissions. User requires specific access rights and minimum permissions. Details: https://help.druva.com/en/articles/15069296'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP_403'
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in inSync Cloud.
          content:
            application/json:
              schema:
