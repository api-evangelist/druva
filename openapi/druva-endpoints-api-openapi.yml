openapi: 3.2.0
info:
  version: '3.0'
  title: inSync Cloud Endpoints API
  description: Lists the APIs to get information about devices managed in Druva inSync.
servers:
- url: https://apis.druva.com/insync
tags:
- name: Endpoints
  description: Lists the APIs to get information about devices managed in Druva inSync.
paths:
  /endpoints/v1/devices:
    get:
      tags:
      - Endpoints
      summary: List all devices - v1
      description: Returns information about all the user devices protected using Druva inSync.
      security:
      - Bearer: []
      parameters:
      - name: userID
        in: query
        description: Specify the user ID to get a list of devices associated with a single user. Get the ID of a user using the 'List all users' API.
        required: false
        schema:
          type: integer
      - name: userIDs
        in: query
        description: Specify the user IDs, separated by commas, to get a list of devices associated with multiple users. Get the user IDs using the 'List all users' API.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: deviceIDs
        in: query
        description: Filter the list of devices by specifying only the required device IDs, separated by commas. Get the device IDs by using this ‘List all devices’ API.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: profileIDs
        in: query
        description: Specify the profile IDs, separated by commas, to get a list of devices associated with multiple profiles. Get the ID of a profile using the ‘List all profiles’ API.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: searchPrefixDeviceName
        in: query
        description: Specify the prefix from the device name by which you intend to search and list the devices. Example - “My” is the prefix in the device name “MyDevice123”.
        required: false
        schema:
          type: string
      - name: clientVersion
        in: query
        description: Filter the list of devices by the inSync Client version installed on it. Example - 6.2.0
        required: false
        schema:
          type: string
      - name: platformOS
        in: query
        required: false
        description: Filter the list of devices by specifying the operating system of the device.
        schema:
          type: string
          enum:
          - win32
          - linux2
          - darwin
          - android
          - ios
      - name: deviceStatus
        in: query
        required: false
        description: Filter the list by specifying the status of the device.
        schema:
          type: string
          enum:
          - enabled
          - disabled
      - name: upgradeState
        in: query
        required: false
        description: The upgrade state of the device.
        schema:
          type: string
          enum:
          - NOT UPGRADABLE
          - UPGRADABLE
          - UPTODATE
          - SCHEDULED
          - UNKNOWN
      - name: pageToken
        in: query
        description: The token to access the next page of results. Use the token value received in the previous response's parameter 'nextPageToken'.
        required: false
        schema:
          type: string
      - name: minLastConnected
        in: query
        description: Filter to list devices that are connected to Druva inSync after a particular date. Example format - YYYY-MM-DDTHH:MM:SSZ
        required: false
        schema:
          type: string
          format: date-time
      - name: maxLastConnected
        in: query
        description: Filter to list devices that are connected to Druva inSync before a particular date. Example format - YYYY-MM-DDTHH:MM:SSZ
        required: false
        schema:
          type: string
          format: date-time
      - name: minAddedOn
        in: query
        description: Filter to list devices that are added to Druva inSync after a particular date. Example format - YYYY-MM-DDTHH:MM:SSZ
        required: false
        schema:
          type: string
          format: date-time
      - name: maxAddedOn
        in: query
        description: Filter to list devices that are added to Druva inSync after a particular date. Example format - YYYY-MM-DDTHH:MM:SSZ
        required: false
        schema:
          type: string
          format: date-time
      - name: serialNumber
        in: query
        description: Get device information using the unique serial number assigned to an individual piece of hardware by the manufacturer.
        required: false
        schema:
          type: string
      - name: uuid
        in: query
        description: Get device information using the unique 128-bit number UUID used to identify device on internet.
        required: false
        schema:
          type: string
      - name: deviceMarkedInactive
        in: query
        description: Filter the list of devices that are marked as inactive. For example, if you select true, all devices that are marked as inactive are listed. For more information about inactive devices, see <a href=https://docs.druva.com/Endpoints/030_Set_up_inSync_for_Endpoints/010_Initial_Configuration/030_Create_and_manage_profiles/010_Create_a_profile>Create Profile</a>.
        required: false
        schema:
          type: boolean
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or an expired authentication token was supplied.
        '403':
          description: 'Access denied: Insufficient permissions. User requires specific access rights and minimum permissions. Details: https://help.druva.com/en/articles/15069296'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP_403'
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in inSync Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Requested HTTP method is not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getEndpointsV1Devices
      x-operation-id-source: derived
  /endpoints/v1/devices/{deviceID}:
    get:
      tags:
      - Endpoints
      summary: Get device information - v1
      description: Returns device information using deviceID.
      security:
      - Bearer: []
      parameters:
      - name: deviceID
        in: path
        description: The unique ID of device in inSync. Get the ID of a device using the ‘List all devices’ API.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or an expired authentication token was supplied.
        '403':
          description: 'Access denied: Insufficient permissions. User requires specific access rights and minimum permissions. Details: https://help.druva.com/en/articles/15069296'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP_403'
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in inSync Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Requested HTTP method is not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getEndpointsV1DevicesByDeviceID
      x-operation-id-source: derived
    delete:
      tags:
      - Endpoints
      summary: Delete a device
      description: 'Deletes a device in the system. When you delete a device:

        1) All the device data (restore points) is deleted.

        2) You can roll back the deleted device from Rollback Actions until the rollback window lapses.

        3) After the rollback window lapses, the device will be deleted permanently. For more information, see Rollback Actions.'
      security:
      - Bearer: []
      parameters:
      - name: deviceID
        in: path
        description: The unique ID of device in Endpoints. Get the ID of a device using the ‘List all devices’ API.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                deletionReason:
                  description: Specify the reason for device deletion, (the character limit of reason is between 10-150) . This capability will help prevent accidental deletions. If no reason is specified, the default reason i.e. <b>API initiated Device Deletion</b> will be displayed.
                  type: string
                  example: Inactive device
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or an expired authentication token was supplied.
        '403':
          description: 'Access denied: Insufficient permissions. User requires specific access rights and minimum permissions. Details: https://help.druva.com/en/articles/15069296'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP_403'
        '404':
          description: The requested resource was not found.
        '422':
          description: The request was well-formed but was unprocessable due to  semantic errors.
        '500':
          description: The request was not processed due to an internal error in inSync Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Requested HTTP method is not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: deleteEndpointsV1DevicesByDeviceID
      x-operation-id-source: derived
  /endpoints/v1/devices/{deviceID}/disable:
    post:
      tags:
      - Endpoints
      summary: Disable a device
      description: Disables a user device. Once disabled, the data backup from the device stops, and the user can no longer restore data to that same device. The data of disabled device is available in inSync and can be restored to different devices belonging to the same user, either by the user or an administrator.
      security:
      - Bearer: []
      parameters:
      - name: deviceID
        in: path
        description: The unique ID of device in inSync. Get the ID of a device using the ‘List all devices’ API.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or an expired authentication token was supplied.
        '403':
          description: 'Access denied: Insufficient permissions. User requires specific access rights and minimum permissions. Details: https://help.druva.com/en/articles/15069296'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP_403'
        '404':
          description: The requested resource was not found.
        '422':
          description: The request was well-formed but was not processed due to semantic errors.
        '500':
          description: The request was not processed due to an internal error in inSync Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Requested HTTP method is not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postEndpointsV1DevicesByDeviceIDDisable
      x-operation-id-source: derived
  /endpoints/v1/devices/{deviceID}/enable:
    post:
      tags:
      - Endpoints
      summary: Enable a device
      description: Enables a user's device. After the device is enabled, the user of the selected device can start taking its backup and restore.
      security:
      - Bearer: []
      parameters:
      - name: deviceID
        in: path
        description: The unique ID of device in inSync. Get the ID of a device using the ‘List all devices’ API.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or an expired authentication token was supplied.
        '403':
          description: 'Access denied: Insufficient permissions. User requires specific access rights and minimum permissions. Details: https://help.druva.com/en/articles/15069296'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP_403'
        '404':
          description: The requested resource was not found.
        '422':
          description: The request was well-formed but was not processed due to semantic errors.
        '500':
          description: The request was not processed due to an internal error in inSync Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Requested HTTP method is not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postEndpointsV1DevicesByDeviceIDEnable
      x-operation-id-source: derived
  /endpoints/v1/devicemappings:
    post:
      tags:
      - Endpoints
      summary: Create device mapping
      description: Creates a secure user-to-device mapping to perform a mass deployment in a non-AD/LDAP environment or perform bulk replace of devices. The user-to-device mapping ensures controlled device and user activation of inSync client and prevents addition of rogue or unauthorized devices to inSync.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Device Mapping
              required:
              - emailID
              - userName
              - deviceName
              - deviceIdentifierType
              - deviceIdentifier
              properties:
                emailID:
                  description: Specify the email address of the user. Example - ernie.carter@druva.com
                  type: string
                  example: ernie.carter@druva.com
                userName:
                  description: Specify the username of the user in Druva inSync. Example - Ernie Carter
                  type: string
                  example: Ernie Carter
                deviceName:
                  description: Specify the name of the device that is registered with the user. Example - Ernie Carter's Macbook
                  type: string
                  example: ErnieCarter's Macbook
                deviceIdentifierType:
                  description: Specify the unique device identifier type of the device.(serial-number, uuid, or hostname)
                  type: string
                  example: serial-number
                  enum:
                  - serial-number
                  - uuid
                  - hostname
                deviceIdentifier:
                  description: Specify the unique device identifier for the selected type. (serial-number, uuid, or hostname).
                  type: string
                  example: P0XGGGH
                oldDeviceName:
                  description: "Name of the user's old device in Druva inSync that is to be replaced with a new device. \n\n:fa-info-circle: Note: Specify the value for this parameter only if you want to replace the device for the user, else keep this field blank."
                  type: string
                  example: ErnieCarter's Old Macbook
                restoreData:
                  description: "The type of data restore to be performed.(ALL, SYSTEM, OR DATA)\n Type of data to be restored on the new device.Specify one of the following value:\n 1) All - To restore both, the data and the system settings from the existing device on the new device.\n2) SYSTEM - To restore only the system settings from the existing device on the new device.\n3)DATA - To restore only the data from the existing device on the new device.\n\n:fa-info-circle: Note: Specify the value for this parameter only if you want to replace the device for the user, else keep this field blank."
                  type: string
                  example: SYSTEM
                  enum:
                  - ALL
                  - DATA
                  - SYSTEM
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMappingCreate'
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or an expired authentication token was supplied.
        '403':
          description: 'Access denied: Insufficient permissions. User requires specific access rights and minimum permissions. Details: https://help.druva.com/en/articles/15069296'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP_403'
        '404':
          description: The requested resource was not found.
        '422':
          description: The request was well-formed but was not processed due to semantic errors.
        '500':
          description: The request was not processed due to an internal error in inSync Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Requested HTTP method is not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postEndpointsV1Devicemappings
      x-operation-id-source: derived
    get:
      tags:
      - Endpoints
      summary: List device mapping
      description: Returns a list of user-to-device mapping created to perform a mass deployment in a non-AD/LDAP environment or perform bulk replace of devices.
      security:
      - Bearer: []
      parameters:
      - name: emailID
        in: query
        description: Filter to list device mappings using the email address of a user.
        required: false
        schema:
          type: string
      - name: deviceIdentifierType
        in: query
        description: Filter to list device mappings using the unique device identifier type of the device.(serial-number, uuid, or hostname).
        required: false
        schema:
          type: string
          enum:
          - serial-number
          - uuid
          - hostname
      - name: deviceIdentifier
        in: query
        description: Specify the unique id of the device for the selected deviceIdentifierType in inSync.
        required: false
        schema:
          type: string
      - name: restoreData
        in: query
        description: Filter to list device mappings using the type of data restore performed
        required: false
        schema:
          type: string
          enum:
          - All
          - Data
          - System
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMappingList'
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or an expired authentication token was supplied.
        '403':
          description: 'Access denied: Insufficient permissions. User requires specific access rights and minimum permissions. Details: https://help.druva.com/en/articles/15069296'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP_403'
        '404':
          description: The requested resource was not found.
        '422':
          description: The request was well-formed but was not processed due to semantic errors.
        '500':
          description: The request was not processed due to an internal error in inSync Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Requested HTTP method is not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getEndpointsV1Devicemappings
      x-operation-id-source: derived
  /endpoints/v1/devicemappings/{mappingID}:
    delete:
      tags:
      - Endpoints
      summary: Delete device mapping
      description: Permanently deletes a user-to-device mapping created for mass deployment.
      security:
      - Bearer: []
      parameters:
      - name: mappingID
        in: path
        description: The id associated with the device mapping. Get the mapping id by running the List Device Mapping API.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK. The device mapping is deleted successfully.
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or an expired authentication token was supplied.
        '403':
          description: 'Access denied: Insufficient permissions. User requires specific access rights and minimum permissions. Details: https://help.druva.com/en/articles/15069296'
          content:
