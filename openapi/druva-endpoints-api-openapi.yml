          format: int64
          description: The unique id of the device in inSync. Example - 12345
          example: 12345
        deviceName:
          type: string
          description: The device name in inSync. Example - Ernie Carter's Macbook
          example: Ernie Carter's Macbook
        serialNumber:
          type: string
          description: A unique, identifying number assigned to an individual piece of hardware by the manufacturer. Example - PX045
          example: PX045
        deviceOS:
          type: string
          description: The operating system of the device. Example - Mojave
          example: mojave
        deviceOSVersion:
          type: string
          description: The version of the operating system of the device. Example - 10.14 r34567
          example: 10.14 r34567
        platformOS:
          type: string
          description: The operating system platform of the device. Example - darwin
          example: darwin
          enum:
          - win32
          - linux2
          - darwin
          - android
          - ios
        uuid:
          type: string
          description: A 128-bit number used to uniquely identify device in internet. Example - TY5h67-5674r-675645
          example: TY5h67-5674r-675645
        clientVersion:
          type: string
          description: The inSync Client version installed on the device. Example - 6.1.0 r56746
          example: 6.1.0 r56746
        deviceStatus:
          type: string
          description: The status of the device. Example - enabled
          enum:
          - enabled
          - disabled
        upgradeState:
          type: string
          description: The upgrade state of the device.
          enum:
          - NOT UPGRADABLE
          - UPGRADABLE
          - UPTODATE
          - SCHEDULED
          - UNKNOWN
        userID:
          type: integer
          description: A unique id of the user in inSync.
          example: 1
        totalBackupData:
          type: string
          description: The storage quota consumed by the user.
          example: 40.05 GB
        totalBackupDataInBytes:
          type: integer
          description: The storage quota consumed by the user (in bytes).
          example: 43003360051
        addedOn:
          type: string
          format: date-time
          description: The date and time on which the device was added to inSync. Example - 2019-10-25T00:00:00Z
          example: '2019-10-25T00:00:00Z'
        lastUpgradedOn:
          type: string
          format: date-time
          description: The date on which the inSync Client was last updated for the user. Example - 2019-10-25T00:00:00Z
          example: '2019-10-25T00:00:00Z'
        lastConnected:
          type: string
          format: date-time
          description: The date and time on which the inSync Client last connected with inSync Cloud. Example - 2019-10-25T00:00:00Z
          example: '2019-10-25T00:00:00Z'
        deviceMarkedInactive:
          type: boolean
          description: Devices marked as inactive. Example - true
          example: true
    BackupList:
      type: object
      properties:
        totalSize:
          type: integer
          format: int64
          example: 1
        nextPageToken:
          type: string
          description: The token to access next page of results. This parameter will be empty for the last page of results.
          example: MTExMQ==
        backups:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
    Restore:
      type: object
      properties:
        deviceID:
          type: integer
          description: 'The unique ID of the device from which the restore activity was triggered. Example: 12345'
        targetDeviceID:
          type: integer
          description: 'The device ID of the device to which the data was restored. Example: 12345'
        restoreLocation:
          type: string
          description: "The location on the device to which the data was restored. \nThe possibles locations are:\n 1) Original: If the data was restored to the original location\n 2) Desktop: If the data was restored to desktop\n 3)Custom location: If data was restored to a custom location\n 4) Unknown: If the restore was performed from a mobile device to a mobile device."
        userID:
          type: integer
          description: 'The unique ID of the user who triggered the restore activity. Example: 12345'
        restoreID:
          type: integer
          description: 'The unique ID of the restore activity. This value is ''null'' in case of restore was initiated from a mobile device. Example: 12345'
        startTime:
          type: string
          format: date-time
          description: "The start time of the restore activity. \nExample: 2013-04-17T09:12:36Z"
        endTime:
          type: string
          format: date-time
          description: 'The end time of the restore activity. Example: 2013-04-17T09:13:36Z. This value is empty if the restore activity is ongoing.'
        status:
          type: string
          description: "Status of the restore activity. It is:\n 1) Successful: If the restore activity was completed successfully.\n 2) Ongoing: If the restore activity is ongoing. \n 3) Failed: If the restore activity was failed.\n4) Cancelled: If the restore activity was cancelled manually.\n 5) Completed with Errors: If some files were missed during the restore activity."
        restoreSize:
          type: string
          description: "The size of the data restored. Example: 285 MB \n This value is 'Unknown' for restores that failed to start. "
        numberOfFilesRestored:
          type: integer
          description: 'The total number of files that were restored in the restore activity. Example: 456'
        numberOfFilesMissed:
          type: integer
          description: "The total number of files that were missed from the restore activity. Example: 12 \n This value is 'null' if the restore activity is ongoing."
        restoreMode:
          type: string
          description: "The persona who initiated the restore. Personas are: \nSelf: inSync user himself \nAdmin: Administrator."
        systemSettingsRestore:
          type: boolean
          description: This returns 'true' if system setting were restored else returns 'false'.
        failureReason:
          type: string
          description: This returns the failure reason if the status is 'failed' else returns 'empty.
          example: ''
    Error:
      type: object
      properties:
        code:
          type: string
          example: InsyncEndpoints-1006
          description: Application specific error code
        message:
          type: string
          example: Internal server error
          description: Application specific error message
        retryable:
          type: boolean
          default: false
          description: If true, retry using exponential backoff
        data:
          type: object
          description: Dictionary of values present in the error message for localization. Currently, no values are available.
    DeviceMappingListResponse:
      type: object
      properties:
        mappingID:
          type: string
          description: The id of the device mapping in inSync. Example - 3452rw6
