        '404':
          description: The requested resource was not found.
        '422':
          description: The request was well-formed but was not processed due to semantic errors.
        '500':
          description: The request was not processed due to an internal error in inSync Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Requested HTTP method is not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: deleteEndpointsV1DevicemappingsByMappingID
      x-operation-id-source: derived
