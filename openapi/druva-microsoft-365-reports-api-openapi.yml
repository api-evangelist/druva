          type: string
          description: EPOCH timestamp indicates the time when the Teams was added to DB.
          format: date-time
          example: '2024-07-26T11:56:29.000Z'
        backupFrequency:
          type: integer
          description: 'Specifies the backup frequency denoted by specific integer values.

            For example:

            • 720 - Twice A day

            • 1440 - Once A day

            • 4320 - Twice A Week

            • 10080 - Once A Week

            • 480 - Thrice A day

            • 2880 - Thrice A Week

            • 240 - Five Times a day

            • 0 - Never'
          example: 1440
