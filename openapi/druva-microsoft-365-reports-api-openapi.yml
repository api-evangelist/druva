    M365SharePointSiteDiscoveryReportData:
      title: M365SharePointSiteDiscoveryReportData
      type: object
      properties:
        accountName:
          type: string
          description: Account name defined for the customer
          example: Druva
        customerName:
          type: string
          description: Customer name defined for the customer
          example: Druva
        customerGlobalId:
          type: string
          description: Unique ID of the customer.
          example: bde7f8c2-d063-4a4a-9a8f-c2ea5aff42f3-198
        lastUpdatedTime:
          type: string
          description: The last updated time stamp for the record. The time is in the UTC time zone. Example - 2019-10-25T00:00:00Z
          format: date-time
          example: '2023-06-04T10:05:18.493Z'
        siteName:
          type: string
          description: Specifies the name of the site stored in DB.
          example: 007 - pvt-channel-new
        siteURL:
          type: string
          description: Specifies the URL for that site.
          example: https://dglobal.sharepoint.com/sites/007-pvt-channel-new
        siteType:
          type: string
          description: Specifies the type of a particular site. For example - "MS Teams Site", "M365 Groups Site"
          example: MS Teams Private Channel Site
        addedOn:
          type: string
          description: EPOCH timestamp indicates the time when the site was added to DB.
          format: date-time
          example: '2024-08-08T14:05:50.000Z'
        backupFrequency:
          type: integer
          description: 'Specifies the backup frequency denoted by specific integer values.

            For example:

            • 720 - Twice A day

            • 1440 - Once A day

            • 4320 - Twice A Week

            • 10080 - Once A Week

            • 480 - Thrice A day

            • 2880 - Thrice A Week

            • 240 - Five Times a day

            • 0 - Never'
          example: 1440
        retention:
          type: string
          description: Specifies the retention policy for backups, indicating the duration for which backups will be kept. The format follows a combination of days (D), weeks (W), and months (M). For example, "5D, 4W, 12M" means backups will be retained for 5 days, 4 weeks, and 12 months.
          example: 8D, 5W, 13M
        appStatus:
          type: string
          description: Specifies the status of the configured site. For example - "Enabled" or "Disabled"
          example: Enabled
        geolocation:
          type: string
          description: Specifies the geolocation of the configured site. For example - "APC (Macro Region Geography 2 - Asia-Pacific)", "AUS (Australia)"
          example: FRA (France)
        totalBackupData:
          type: integer
          description: Specifies the value of the total backup data stored in bytes.
          example: 482739
        lastSuccessfulBackup:
          type: string
          description: Specifies the EPOCH timestamp indicating the time when the last backup was successful.
          format: date-time
          example: '2024-08-28T07:29:43.000Z'
        lastBackupAttempted:
          type: string
          description: Specifies the EPOCH timestamp indicating the time when the last backup was attempted.
          format: date-time
          example: '2024-08-28T07:29:43.000Z'
        lastBackupStatus:
          type: string
          description: Specifies the status of the last backup attempted, Example - "`Backup Successful`"
          example: Backed Up Successfully
        errorDetailsOld:
          type: string
          description: A string representing error occured for the last backup job. For example - "`EUSERNOTFOUND`"
          example: '-'
        errorDetailsNew:
          type: string
          description: 'A string represents all the errors during the last backup in a comma-separated format. For example - "100010016,100000001".


            The actual error strings associated with the error codes are as below.

            **100000001** - Internal error

            **1000000f7** - Throttling Issue

            **10000000b** - Quota limit reached

            **10000000A** - Task Aborted

            **100000016** - Authorization Failed

            **100000046** - Insufficient Permissions

            **10000004b** - Task Canceled

            **100010001** - File is checked out

            **100010002** - MS Team site channel update failed

            **100010007** - Character Limit Exceeded

            **100010009** - Token Invalid

            **10001000f** - User Not Found

            **100010010** - Microsoft List View Threshold Reached

            **100010011** - Virus Infected File

            **100010013** - File Not Found

            **100010014** - Connection Error From Microsoft

            **100010015** - The site level feature is not available in SharePoint Online

            **100010016** - Site Not Found

            **100010017** - Metadata Restore Failed

            **100010018** - Site Feature Restore Failed

            **100010019** - Quick Launch Node Restore Failed

            **10001001a** - Top Navigation Bar Restore Failed

            **10001001b** - Term Store Restore Failed

            **10001001c** - List Item Restore Failed

            **10001001d** - Site Not Found in SharePoint PowerShell

            **10001001f** - SharePoint Site Busy

            **100010020** - SharePoint Storage Issue

            **100010023** - Cannot Restore Active Solution

            **100010024** - SharePoint Site Locked'
          example: '100000001'
        storageRegion:
          type: string
          description: Specifies the name of the storage assigned.
          example: us-east-1
        isDeleted:
          type: integer
          description: Indicates whether the site is deleted from the database.
          example: 0
