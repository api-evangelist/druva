openapi: 3.2.0
info:
  version: '3.0'
  title: Enterprise Workloads AHV API
servers:
- url: //apis.druva.com/phoenix
tags:
- name: AHV
paths:
  /ahv/v1/orgs/{OrgID}/reports/backupsets:
    get:
      description: Returns all backup sets
      tags:
      - AHV
      security:
      - Bearer: []
      summary: List all backup sets
      operationId: AHVGetBackupsetsRequest
      parameters:
      - description: Specify the organization ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: VMNames
        description: Specify the name of the virtual machine. Specify multiple virtual machine names by separating names with commas.
        name: vmName
        in: query
        schema:
          type: string
      - x-go-name: BackupEnable
        description: Specify whether the backup is enabled or disabled for the virtual machine.
        name: backupEnable
        in: query
        schema:
          type: boolean
      - x-go-name: PageToken
        description: Specify the token to access the results on the next page. Keep this field blank for the first request. To view the results on the next page, use the value received in the 'nextPageToken' parameter of the previous response.
        name: pageToken
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/AHVGetBackupsetsResponse'
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or the authentication token was expired.
        '403':
          description: Forbidden
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/ServiceError'
  /ahv/v1/orgs/{OrgID}/reports/jobs:
    get:
      description: Returns all jobs
      tags:
      - AHV
      security:
      - Bearer: []
      summary: List all jobs
      operationId: AHVGetAllJobsInfoRequest
      parameters:
      - description: Specify the organization ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: JobType
        description: Specify the type of the job. Set this value as "Backup", "Restore", or "Log Request". Specify multiple job types by separating them with commas.
        name: jobType
        in: query
        schema:
          type: string
      - x-go-name: Status
        description: Specify the status of the job. Set this value as "Queued", "Running", "Successful", "Successful with errors", or "Failed". Specify multiple status values by separating them with commas.
        name: status
        in: query
        schema:
          type: string
      - x-go-name: VMName
        description: Specify the name of the VM. Specify multiple VM names by separating them with commas.
        name: vmName
        in: query
        schema:
          type: string
      - x-go-name: PageToken
        description: Specify the token to access the results on the next page. Keep this field blank for the first request. To view the results on the next page, use the value received in the 'nextPageToken' parameter of the previous response.
        name: pageToken
        in: query
        schema:
          type: string
      - x-go-name: StartTime
        description: Specify the date and time to filter jobs that were run during the specified timestamp. Specify the date and time in UTC format (YYYY-MM-DDTHH:MM:SSZ). The timestamp must be within six months from the current date. For example, if the current date is 2020-10-02, you can specify any date between 2020-04-03 to 2020-10-02.
        name: fromTime
        in: query
        schema:
          type: string
          format: date-time
      - x-go-name: EndTime
        description: Specify the date and time to filter jobs that were run until the specified timestamp. Specify the date and time in UTC format. The format is YYYY-MM-DDTHH:MM:SSZ.
        name: toTime
        in: query
        schema:
          type: string
          format: date-time
      - x-go-name: SortOrder
        description: Sort the API results by the scheduled time of the job, either in ascending or descending order. Set the sortOrder value to ASC or DESC. The default value is ASC.
        name: sortOrder
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/AHVGetAllJobsInfoResponse'
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or the authentication token was expired.
        '403':
          description: Forbidden
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/ServiceError'
