components:
  schemas:
    AHVEstimationDetailsStruct:
      description: The estimation details of the job.
      type: object
      properties:
        dataScanned:
          description: Total data scanned during the job.
          type: integer
          format: uint64
          x-go-name: DataScanned
        disksAdded:
          description: Number of VM Disks added at source during the job.
          type: integer
          format: int64
          x-go-name: DisksAdded
        disksModified:
          description: Number of VM Disks changed at source during the job.
          type: integer
          format: int64
          x-go-name: DisksModified
        disksRemoved:
          description: Number of VM Disks removed at source during the job.
          type: integer
          format: int64
          x-go-name: DisksRemoved
        sourceDataScanned:
          description: The data scanned in megabytes at the source for backup.
          type: string
          x-go-name: SourceDataScanned
        sourceDataScannedInBytes:
          description: The data scanned in bytes at the source for backup.
          type: integer
          format: uint64
          x-go-name: SourceDataScannedInBytes
      x-go-name: EstimationDetailsStruct
      x-go-package: phoenix/ahv/cloud/report/spec/jobs
    AHVGetUploadLogsJobsReport:
      description: Details of upload log jobs.
      type: object
      properties:
        environmentDetails:
          $ref: '#/components/schemas/AHVUploadLogsEnvironmentStruct'
        executionDetails:
          $ref: '#/components/schemas/AHVUploadLogsExecutionDetailsStruct'
        jobID:
          description: A unique identification number associated with the job.
          type: integer
          format: int32
          x-go-name: JobID
        jobType:
          description: Type of the operation.
          type: string
          x-go-name: JobType
        organizationName:
          description: The name of the organization.
          type: string
          x-go-name: OrgName
        vmName:
          description: The name of the VM.
          type: string
          x-go-name: VMName
      x-go-name: GetUploadLogsJobsReport
      x-go-package: phoenix/ahv/cloud/report/spec/jobs
    AHVGetPolicies:
      description: Details of backup policies.
      type: object
      properties:
        automaticRetry:
          description: Indicates whether automatic retry is enabled or disabled for the job.
          type: boolean
          x-go-name: AutomaticRetry
        dataLock:
          description: Indicates whether Data Lock is enabled in the backup policy.
          type: boolean
          x-go-name: ImmutabilityEnabled
        description:
          description: The policy description.
          type: string
          x-go-name: Description
        ignoreFirstBackupDuration:
          description: Indicates whether the first backup duration is to be ignored or not.
          type: boolean
          x-go-name: IgnoreBackupDuration
        maxRetryCount:
          description: The maximum number of retries.
          type: integer
          format: int64
          x-go-name: MaxRetryCount
        maxRetryDuration:
          description: The wait interval before the job is retried.
          type: string
          x-go-name: MaxRetryDuration
        maxRetryDurationInSeconds:
          description: The wait interval in seconds before the job is retried.
          type: integer
          format: int64
          x-go-name: MaxRetryDurationInSeconds
        policyID:
          description: The ID of your backup policy.
          type: integer
          format: int64
          x-go-name: PolicyID
        policyName:
          description: The name of the policy.
          type: string
          x-go-name: PolicyName
        policyType:
          description: The type of the policy.
          type: string
          x-go-name: PolicyType
        retention:
          $ref: '#/components/schemas/AHVRetentionPolicy'
        schedules:
          description: Schedules for the backup.
          type: array
          items:
            $ref: '#/components/schemas/AHVSchedules'
          x-go-name: Schedules
      x-go-name: GetPolicies
      x-go-package: phoenix/ahv/cloud/report/spec/policies
    AHVGetBackupProxiesResponse:
      description: List all backup proxies response.
      type: object
      properties:
        nextPageToken:
          description: The token to access the next page of results. This parameter will be empty for the last page of results.
          type: string
          x-go-name: OutToken
        proxies:
          description: The list of the backup proxies deployed and the information of each backup proxy.
          type: array
          items:
            $ref: '#/components/schemas/AHVBackupProxyInfo'
          x-go-name: BackupProxies
      x-go-name: GetBackupProxiesResponse
      x-go-package: phoenix/ahv/cloud/report/spec/proxies
    AHVSchedules:
      description: Details of schedules for the backup.
      type: object
      properties:
        bandwidth:
          description: The maximum bandwidth allowed for the backup.
          type: string
          x-go-name: Bandwidth
        bandwidthInKBps:
          description: The maximum bandwidth allowed for the backup in KBps.
          type: number
          format: double
          x-go-name: BandwidthInKBps
        duration:
          description: The duration after which you want the backup jobs to stop.
          type: string
          x-go-name: Duration
        durationInSeconds:
          description: The duration in seconds after which you want the backup jobs to stop.
          type: integer
          format: int64
          x-go-name: DurationInSeconds
        repeatOn:
          $ref: '#/components/schemas/JSONStringList'
        startAt:
          description: The scheduled start time.
          type: string
          x-go-name: StartAt
      x-go-name: Schedules
      x-go-package: phoenix/ahv/cloud/report/spec/policies
    AHVUploadLogsExecutionDetailsStruct:
      description: The execution details of the job.
      type: object
      properties:
        endTime:
          description: The time when the job completes.
          type: string
          x-go-name: EndTime
        errorCode:
          description: "The error code for the failed jobs. The possible values are:\n\n \\\"0\\\": If the job is successful\n\n<error_number>: If the job has failed"
          type: string
          x-go-name: ErrorCode
        errorMessage:
          description: The error message for the failed jobs. This field is empty if the job is successful.
          type: string
          x-go-name: ErrorMsg
        logsExpiryTime:
          description: Expiry time of the uploaded logs.
          type: string
          x-go-name: LogsExpiryTime
        logsSize:
          description: The size of the extracted log files.
          type: string
          x-go-name: LogsSize
        logsSizeInBytes:
          description: The size of the extracted log files in bytes.
          type: integer
          format: uint64
          x-go-name: LogsSizeInBytes
        sourceJobID:
          description: The job for which logs are requested.
          type: integer
          format: int32
          x-go-name: SourceJobID
        sourceJobLogType:
          description: The job type for which logs are requested.
          type: string
          x-go-name: SourceJobLogType
        startTime:
          description: The time when the job starts.
          type: string
          x-go-name: StartTime
        status:
          description: The status of the job.
          type: string
          x-go-name: Status
      x-go-name: UploadLogsExecutionDetailsStruct
      x-go-package: phoenix/ahv/cloud/report/spec/jobs
    AHVJobResponse:
      description: Details of all jobs.
      type: object
      properties:
        endTime:
          description: The time when the job completes.
          type: string
          x-go-name: EndTime
        errorCode:
          description: "The error code for the failed jobs. The possible values are:\n\n \\\"0\\\": If the job is successful\n\n<error_number>: If the job has failed"
          type: string
          x-go-name: ErrorCode
        errorMessage:
          description: The error message for the failed jobs. This field is empty if the job is successful.
          type: string
          x-go-name: ErrorMsg
        jobID:
          description: A unique identification number associated with the job.
          type: integer
          format: int32
          x-go-name: JobID
        jobType:
          description: The type of job.
          type: string
          x-go-name: JobType
        organizationName:
          description: The name of the organization.
          type: string
          x-go-name: OrgName
        startTime:
          description: The time when the job starts.
          type: string
          x-go-name: StartTime
        status:
          description: Status of the job.
          type: string
          x-go-name: Status
        vmName:
          description: The name of VM.
          type: string
          x-go-name: VMName
      x-go-name: JobResponse
      x-go-package: phoenix/ahv/cloud/report/spec/jobs
    AHVDataTransferStruct:
      description: The data transfer details of the job.
      type: object
      properties:
        backupDuration:
          description: The total time taken to upload data to the Druva Cloud and CloudCache. Backup duration excludes the estimation time, network retry time, and the waiting for retry time.
          type: string
          x-go-name: BackupDuration
        backupDurationInSeconds:
