    MSPChargebackTenantConsumptionReportData:
      type: object
      properties:
        date:
          type: string
          description: The date on which the consumption was recorded. Date is specified in 'RFC3339' format.
          format: date
          example: '2025-01-11T00:00:00.000Z'
        accountName:
          type: string
          description: The account name of the customer.
          example: Example customer
        customerName:
          type: string
          description: The name of the customer.
          example: Example customer
        customerGlobalId:
          type: string
          description: Unique ID of the customer.
          example: bde7f8c2-d063-4a4a-9a8f-c2ea5aff42f3-198
        productId:
          type: integer
          enum:
          - 1
          - 2
          description: "The ID of the product. 1 - Enterprise Workloads, 2 - SaaS Apps and Endpoints. This field will be updated in the future for addition of new products as and when applicable.\n For valid products and their Product Features, see - https://developer.druva.com/docs/msp-product-and-attribute-values\n"
          example: 1
        productName:
          type: string
          enum:
          - Enterprise Workloads
          - SaaS Apps and Endpoints
          description: The name of the product. This field will be updated in the future for addition of new products as and when applicable.
          example: Enterprise Workloads
        productModule:
          type: string
          enum:
          - Enterprise Workloads
          - Microsoft 365
          - Endpoints
          - Google Workspace
          description: 'The name of the product module.

            This field will be updated in the future for addition of new product modules as and when applicable.'
          example: Enterprise Workloads
        productModuleId:
          type: integer
          description: The ID of the product module. 1 - Enterprise Workloads, 2 - Microsoft 365, 3 - Endpoints, 4 - Google Workspace
          enum:
          - 1
          - 2
          - 3
          - 4
          example: 1
