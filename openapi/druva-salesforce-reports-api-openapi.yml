components:
  schemas:
    SfdcBackupActivityReportData:
      title: SfdcBackupActivityReportData
      type: object
      properties:
        accountName:
          type: string
          description: Customer account name for the Salesforce backup activity row.
          example: Customer Account Name
        globalCustomerId:
          type: string
          description: The unique identifier of the customer.
          example: bde7f8c2-d063-4a4a-9a8f-c2ea5aff42f3-198
        customerName:
          type: string
          description: The name of the customer.
          example: Acme Corporation
        backupType:
          type: string
          description: Backup type of activity. Example - Incremental, Full
          example: Full
        completedTime:
          type: string
          description: 'Backup job completion time. The time is in the UTC zone. Example: For Jan 28, 2025 10 PM: 2025-01-28T22:00:00Z'
          format: date-time
          example: '2025-01-28T22:00:00Z'
        definitionName:
          type: string
          description: The name of the backup definition to which the activity belongs
          example: source001_definition_2023_07_19_00_29_3
        endTime:
          type: string
          description: 'End time in UTC format until record changes captured in each backup job must be identified. Example: For Jan 29, 2025 10 PM: 2025-01-29T22:00:00Z'
          format: date-time
          example: '2025-01-29T22:00:00Z'
        organizationID:
          type: string
          description: Salesforce organization ID
          example: 00D1100000C9ysvEA
        organizationName:
          type: string
          description: The name of the salesforce organization to which the activity belongs
          example: source001
        projectName:
          type: string
          description: The name of the project to which the activity belongs
          example: test Project
        salesforceUser:
          type: string
          description: The name of the salesforce user who initiated the activity
          example: sfdc2_sanity sfdc2_sanity
        startTime:
          type:
          - string
          - 'null'
          description: 'Start time in UTC format from where record changes captured in each backup job needs to be identified. Example: For Jan 28, 2025 10 PM: 2025-01-28T22:00:00Z'
          format: date-time
          example: '2025-01-28T22:00:00Z'
        status:
          type: string
          description: Backup job status of the activity
          example: Completed
        statusDetails:
          type:
          - string
          - 'null'
          description: Error details if any
          example: Backup completed successfully.
        totalBackupSize:
          type: integer
          description: Total backup data size of the activity in bytes
          example: 2200
        totalDataBackupSizeInMB:
          type: integer
          description: Total logical data backed up, in megabytes.
          example: 1000
        totalRecordsBackedUp:
          type: integer
          description: Count of Salesforce records included in the backup.
          example: 500
        dcpUniqueKey:
          type: string
          description: The key which is used to uniquely identify each record in the report.
          example: 60d66ec60c0e061e88db0448a1bfc609c1db4cbe336b9b64bb5b0cd1113694e3
    APIError:
      description: APIError defines an application error result format
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    GetSfdcArchivalRestoreActivityReportDataResponse:
      title: GetSfdcArchivalRestoreActivityReportDataResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SfdcArchivalRestoreActivityReportData'
          x-go-name: Data
        lastSyncTimestamp:
          type: string
          format: date-time
          description: The time stamp until which the report data was returned. The time is in the UTC time zone.
        filters:
          type: object
          properties: {}
          description: Filters applied on the report
        nextPageToken:
          type: string
          description: The token to access the next page of results. This parameter will be empty for the last page of the results. This token is valid for 5 minutes.
    GetSfdcBackupActivityReportDataResponse:
      title: GetSfdcBackupActivityReportDataResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SfdcBackupActivityReportData'
          x-go-name: Data
        lastSyncTimestamp:
          type: string
          description: The time stamp until which the report data was returned. The time is in the UTC time zone.
          format: date-time
        filters:
          type: object
          properties: {}
          description: Filters applied on the report.
        nextPageToken:
          type: string
          description: The token to access the next page of results. This parameter will be empty for the last page of the results. This token is valid for 5 minutes.
          example: ZGE4ZWYwYzctNDEwZi00MTVjLWJhNzgtMTFiYzQzMzA2ODMy
    GetSfdcSandboxSeedingActivityReportDataResponse:
      title: GetSfdcSandboxSeedingActivityReportDataResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SfdcSandboxSeedingActivityReportData'
          x-go-name: Data
        lastSyncTimestamp:
          type: string
          format: date-time
          description: The time stamp until which the report data was returned. The time is in the UTC time zone.
        filters:
          type: object
          properties: {}
          description: Filters applied to the report
        nextPageToken:
          type: string
          description: The token to access the next page of results. This parameter will be empty for the last page of the results. This token is valid for 5 minutes.
    SfdcSandboxSeedingActivityReportData:
      title: SfdcSandboxSeedingActivityReportData
      type: object
      properties:
        accountName:
          type: string
          description: Customer account name for the sandbox seeding activity row.
          example: Customer Account Name
        globalCustomerId:
          type: string
          description: The unique identifier of the customer.
          example: bde7f8c2-d063-4a4a-9a8f-c2ea5aff42f3-198
        customerName:
          type: string
          description: The name of the customer.
          example: Acme Corporation
        dataTemplateName:
          type: string
          description: Data template name of the Activity
          example: DC_TC02_Template
        destinationOrganization:
          type: string
          description: The name of the source organization selected for data copy as part of the activity
          example: destin001
        endTime:
          type: string
          description: 'End Time of the data copy task. The time is in the UTC zone. Example: For Jan 28, 2025 10 PM: 2025-01-28T22:00:00Z'
          format: date-time
          example: '2025-01-28T22:00:00Z'
        projectName:
          type: string
          description: The name of the project to which the activity belongs
          example: DataCopyRegression_71759
        recordsCopied:
          type: integer
          description: Count of the records restored as part of the activity
          example: 1000
        salesforceUser:
          type: string
          description: The name of the salesforce user who has initiated the activity
          example: sfdc2_sanity sfdc2_sanity
        sourceOrganization:
          type: string
          description: Source Salesforce org name supplying the data.
          example: source001
        startTime:
          type: string
          description: 'Start Time of the data copy task. The time is in the UTC zone. Example: For Jan 28, 2025 10 PM: 2025-01-28T22:00:00Z'
          format: date-time
          example: '2025-01-28T22:00:00Z'
        statusDetails:
          type: string
          description: Error details if any
          example: ''
        taskState:
          type: string
          description: Task status of the activity
          example: Completed
        totalRecordCount:
          type: integer
          description: The total number of records identified for data copy as part of the activity
          example: 1000
        totalDataCopiedInMB:
          type: integer
          description: Total logical data copied, in megabytes.
          example: 0
        dcpUniqueKey:
          type: string
          description: The key which is used to uniquely identify each record in the report.
          example: 60d66ec60c0e061e88db0448a1bfc609c1db4cbe336b9b64bb5b0cd1113694e3
    SfdcDataRestoreActivityReportData:
      title: SfdcDataRestoreActivityReportData
      type: object
      properties:
        accountName:
          type: string
          description: Customer account name associated with the restore activity.
          example: Customer Account Name
        globalCustomerId:
          type: string
          description: The unique identifier of the customer.
          example: bde7f8c2-d063-4a4a-9a8f-c2ea5aff42f3-198
        customerName:
          type: string
          description: The name of the customer.
          example: Acme Corporation
        backupDefinitionName:
          type: string
          description: The name of the backup definition to which the activity belongs
          example: DR_TC06_Backup
        dataTemplateName:
          type: string
          description: Data template applied for the restore operation.
          example: DR_TC06_Template
        destinationOrganization:
          type: string
          description: Target Salesforce organization name for the restore.
          example: source001
        endTime:
          type: string
          description: 'End time in UTC format until record changes captured in each backup job must be identified. Example: For Jan 29, 2025 10 PM: 2025-01-29T22:00:00Z'
          format: date-time
          example: '2025-01-29T22:00:00Z'
        isDeleted:
          type: integer
          description: Flag to filter out deleted data template
          example: 0
        projectName:
          type: string
          description: The name of the project to which the activity belongs
          example: DataRestoreRegression
        recordsRestored:
          type: integer
          description: Number of records restored in this activity.
          example: 10
        restoreState:
          type: string
          description: Backup job status of the activity
          example: Completed
        salesforceUser:
          type: string
          description: The name of the salesforce user who initiated the activity
          example: sfdc2_sanity sfdc2_sanity
        snapshotTimestamp:
