paths:
  /msp/reporting/v2/reports/mspSfdcBackupActivity:
    post:
      tags:
      - Salesforce Reports
      summary: View Backup Activity Report
      description: 'View the status and details of backup activities for configured Salesforce instances.


        **Note**: This API is subject to ongoing updates and optimization. We recommend regularly checking this documentation for the latest schema changes.'
      operationId: GetSfdcBackupActivityReportDataRequest
      parameters:
      - name: Authorization
        description: Specify the Bearer access token
        schema:
          type: string
        in: header
        required: true
      requestBody:
        description: Request body
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    pageSize:
                      type: integer
                      description: Specify the maximum number of records that should returned in a response. Maximum limit is 500 records. Default pageSize is 100.
                      default: 100
                    filterBy:
                      type: array
                      description: Select the filters to be applied to the report.
                      items:
                        type: object
                        properties:
                          fieldName:
                            type: string
                            description: Specify the name of the filter.
                            example: salesforceUser
                            enum:
                            - accountName
                            - globalCustomerId
                            - customerName
                            - backupType
                            - completedTime
                            - definitionName
                            - endTime
                            - organizationID
                            - organizationName
                            - projectName
                            - salesforceUser
                            - startTime
                            - status
                            - statusDetails
                            - statusDetail
                            - totalBackupSize
                            - totalDataBackupSizeInMB
                            - totalRecordsBackedUp
                            - dcpUniqueKey
                          operator:
                            type: string
                            description: The operators that are supported for the filter are - EQUAL, NOTEQUAL, CONTAINS, LT (less-than), LTEQ (less-than-or-equal), GT (greater-than), GTEQ (greater-than-or-equal).
                            example: EQUAL
                            enum:
                            - EQUAL
                            - GT
                            - GTE
                            - LT
                            - LTE
                            - CONTAINS
                            - NOTEQUAL
                          value:
                            oneOf:
                            - type: string
                              description: string
                            - type: integer
                              description: integer
                            - type: array
                              description: array of strings
                              items:
                                type: string
                            - type: array
                              description: array of integers
                              items:
                                type: integer
                            description: Specify the value of the filter applied to the report.
                            example: sfdc2_sanity sfdc2_sanity
                pageToken:
                  type: string
                  description: Specify the token to access the results on the next page. Keep this field blank for the first request. To view the results on the next page, use the value received in the 'nextPageToken' parameter of the previous response.
                  example: ''
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSfdcBackupActivityReportDataResponse'
        '400':
          description: Bad Request
          content: {}
        '404':
          description: The requested resource was not found.
          content: {}
        '500':
          description: The request was not processed due to an internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
