    PostOrganizationsOnboardingByIdResponse:
      properties:
        AccountId:
          type: string
        ExternalId:
          type: string
        FLSBucketName:
          type: string
        Name:
          type: string
      type: object
  requestBodies:
    PostOrganizationsOnboardingByIdRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PostOrganizationsOnboardingByIdRequest'
      required: true
  securitySchemes:
