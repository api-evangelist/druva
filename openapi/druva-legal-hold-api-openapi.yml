          items:
            type: object
            properties:
              emailId:
                type: string
                description: Email address of users which are already on legal hold.
                example: john.doe@someorg.com
        notOnLegalhold:
          type: array
          description: While deleting a user from a legal hold policy, if a user is already deleted from legal hold then the user email address will be returned in this list. This field is returned only if the action is 'delete'.
          items:
            type: object
            properties:
              emailId:
                type: string
                description: Email address of users which are already deleted from legal hold or are not on legal hold.
                example: john.doe_1@someorg.com
        notInsyncUsers:
          type: array
          items:
            type: object
            description: While adding OR deleting a user from a legal hold policy, if the user is not a valid inSync user then the user email address will be returned in this list.
