  /legalholds/v4/policies/{policyId}/collection-stream:
    get:
      tags:
      - Legal Hold
      description: Returns the list of all Legal Hold devices.
      summary: Lists all the devices of a Legal Hold policy - v4
      deprecated: false
      security:
      - Bearer: []
      parameters:
      - name: policyId
        in: path
        required: true
        description: Specify the unique ID of the Legal Hold policy for which you want the list of devices. Get the ID of a Legal Hold policy using the 'List Legal Hold policies' API. Example - 12529
        schema:
          type: integer
      - name: pageNumber
        in: query
        description: Search the list of devices on Legal Hold according to the page number. Default value - 1 Example - 10.
        schema:
          type: integer
      - name: pageSize
        in: query
        description: 'Search the list of devices on Legal Hold according to their page size. The maximum page size should not exceed 500. The minimum page size should be greater than or equal to 1. Example: 100.'
        schema:
          type: integer
      - name: searchString
        in: query
        description: Search the list of devices on Legal Hold according to the device name. Example - DESKTOP1-device.
        schema:
          type: string
      - name: collectionType
        in: query
        description: Filter the list of devices on Legal Hold according to device type. Example - Backup.
        schema:
          type: string
          enum:
          - Backup
          - Additional
      - name: collectionStatus
        in: query
        description: Filter the list of devices on Legal Hold according to device collection status. Example - Failed.
        schema:
          type: string
          enum:
          - Successful
          - Failed
          - Collected with Errors
          - Never Collected
          - Collection Throttled
          - Inactive
      - name: sortBy
        in: query
        description: Sort to filter the list of devices on Legal Hold. Example - custodianName.
        schema:
          type: string
          enum:
