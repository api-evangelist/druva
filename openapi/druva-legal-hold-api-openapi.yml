components:
  schemas:
    ListLegalHoldPolicies:
      title: ListLegalHoldPolicies
      type: object
      properties:
        results:
          $ref: '#/components/schemas/ListingData'
    GetLegalholds:
      type: object
      properties:
        type:
          type: string
          description: The data access type of the legal hold policy
          enum:
          - All Backup Data
          - Last Backup Data
          - Data within a Date Range
          example: Data within a Date Range
        name:
          type: string
          description: The name of the legal hold policy
          example: LH Policy 1
        policyId:
          type: integer
          description: The ID of the Legal hold policy
          example: '1'
        cullingType:
          type: string
          description: "The filter type of the legal hold policy. \n :fa-info-circle: Applicable only if the data access type is 'Data within a Date Range'."
          enum:
          - Include All Files
          - Include Only Deleted Files
          example: Include Only Deleted Files
        startDate:
          type: string
          description: "The start date in the range in which the data is to be accessed. Format: YYYY-MM-DD \n :fa-info-circle: Applicable only if the data access type is 'Data within a Date Range'."
          format: date
          example: '2019-03-19'
        endDate:
          type: string
          description: "The end date in the range in which the data is to be accessed. Format: YYYY-MM-DD \n :fa-info-circle: Applicable only if the data access type is 'Data within a Date Range'."
          format: date
          example: '2019-10-25'
    CreateLegalHoldPolicyResponse:
      title: CreateLegalHoldPolicyResponse
      type: object
      properties:
        policyId:
          type: integer
          description: The unique ID of the created Legal Hold policy. Example - 12359
          example: 12359
    HTTP_500:
      type: object
      properties:
        code:
          type: string
          enum:
          - inSyncLegalholds-2003
          example: inSyncLegalholds-2003
        message:
          type: string
          example: Programing Error occurred on server, please check server logs for more details
        data:
          type: object
        retryable:
          type: boolean
          enum:
          - false
          - true
          example: false
    RequestCreateLHPolicy:
      type: object
      properties:
        name:
          type: string
          description: The name of the legal hold policy. Example - Legal Hold Policy 1
          example: LH Policy 1
        type:
          type: string
          description: The data access type of the legal hold policy
          enum:
          - All Backup Data
          - Last Backup Data
          - Data within a Date Range
          example: Data within a Date Range
        cullingType:
          type: string
          description: "The filter type of the legal hold policy. \n :fa-info-circle: Applicable only if the data access type is 'Data within a Date Range'. Use any of the filter types"
          enum:
          - Include All Files
          - Include Only Deleted Files
        startDate:
          type: string
          description: "The start date in the range in which the data is to be accessed. Format: YYYY-MM-DD \n :fa-info-circle: Applicable only if the data access type is 'Data within a Date Range'."
          format: date
          example: '2019-03-19'
        endDate:
