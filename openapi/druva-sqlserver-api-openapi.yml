        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SQLBackupNowRequestParams'
        description: The inputs to the BackupNow job request
        required: true
        x-go-name: Params
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/SQLBackupNowResponse'
