openapi: 3.2.0
info:
  version: '3.0'
  title: Enterprise Workloads SQL Server API
servers:
- url: //apis.druva.com/phoenix
tags:
- name: SQLServer
paths:
  /sqlserver/v1/orgs/{OrgID}/reports/availabilitygroup:
    get:
      description: Returns all SQL availability groups.
      tags:
      - SQLServer
      summary: List all SQL availability groups
      operationId: SQLListSQLAvailabilityGroupRequest
      security:
      - Bearer: []
      parameters:
      - description: Specify the organization ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: AgID
        description: Specify the ID of the SQL availability group.
        name: agID
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: SQLResourceName
        description: Specify the name of the SQL availability group.
        name: resourceName
        in: query
        schema:
          type: string
      - x-go-name: SQLResourceType
        description: Specify the resource type of the SQL Server. The possible values for the resource type are "SA" and "AG".
        name: resourceType
        in: query
        schema:
          type: string
      - x-go-name: PageToken
        description: Specify the token to access the results on the next page. Keep this field blank for the first request. To view the results on the next page, use the value received in the 'nextPageToken' parameter of the previous response.
        name: pageToken
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SQLListSQLAvailabilityGroupResponse'
        '400':
          description: Bad Request
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in the Cloud.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceError'
