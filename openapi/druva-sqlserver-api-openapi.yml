  /sqlserver/v1/orgs/{OrgID}/reports/jobs:
    get:
      description: Returns all jobs for SQL.
      tags:
      - SQLServer
      summary: List all jobs
      operationId: SQLGetAllJobsReportRequest
      security:
      - Bearer: []
      parameters:
      - description: Specify the organization ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: JobType
        description: 'Specify the type of the job. The possible values for the job type are: "Backup", "Restore", "Log Request", and "Defreeze". Specify multiple job types by separating the values with commas. For more information, see <a href=https://help.druva.com/en/articles/8651417-monitor-sql-jobs>Job Types.</a>'
        name: jobType
        in: query
        schema:
          type: string
      - x-go-name: SQLResourceName
        description: Specify the name of the SQL standalone instance or availability group for which the job is initiated. Specify multiple resource names by separating the values with commas.
        name: resourceName
        in: query
        schema:
          type: string
      - x-go-name: SQLResourceType
        description: Specify the resource type of the SQL Server. The possible values for the resource type are "SA" and "AG".
        name: resourceType
        in: query
        schema:
          type: string
      - x-go-name: Status
        description: 'Specify the status of the job. The possible values for status are: "Queued", "Running", "Successful", "Successful with errors" and "Failed". Specify multiple job statuses by separating the values with commas.'
        name: status
        in: query
        schema:
          type: string
      - x-go-name: PageToken
        description: Specify the token to access the results on the next page. Keep this field blank for the first request. To view the results on the next page, use the value received in the 'nextPageToken' parameter of the previous response.
        name: pageToken
        in: query
        schema:
          type: string
      - x-go-name: StartTime
        description: Specify a date and time in the UTC format YYYY-MM-DDTHH:MM:SSZ to display all jobs created after this date and time. The timestamp must be within six months from the current date. For example, if the current date is 2020-10-02, you can specify any date between 2020-04-03 to 2020-10-02.
        name: fromTime
        in: query
        schema:
          type: string
          format: date-time
      - x-go-name: EndTime
        description: Specify a date and time in the UTC format YYYY-MM-DDTHH:MM:SSZ to display all jobs created before this date and time. The timestamp must be within six months from the current date.
        name: toTime
        in: query
        schema:
          type: string
          format: date-time
      - x-go-name: SortOrder
        description: Sort the API results by the scheduled time of the job, either in ascending or descending order. Set the sortOrder value to ASC or DESC. The default value is ASC.
        name: sortOrder
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SQLGetAllJobsReportResponse'
        '400':
          description: Bad Request
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in the Cloud.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceError'
