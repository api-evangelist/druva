        name: filter
        required: true
        schema:
          default: '{"region": ["us-east-1"]}'
          type: string
      - description: The number of records to be returned for a single page for the request.
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
      - description: The  you want to order the result set in.
        in: query
        name: order
        required: true
        schema:
          enum:
          - id
          - type
          - region
          - hasbackuppolicy
          - backupsizebytes
          - BackupTime
          - state.Name
          type: string
      - description: The direction you want to order the result set in.
        in: query
        name: direction
        required: true
        schema:
          enum:
          - asc
          - desc
          type: string
      - description: Defines the offset from the first result you want to fetch.
        in: query
        name: offset
        required: true
        schema:
          type: integer
