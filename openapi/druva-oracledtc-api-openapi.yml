          items:
            type: string
      - x-go-name: Status
        description: 'Status of the job. This parameter can be set to one or more of the following values: Queued, Running, Successful and Failed. Specify multiple status values by separating them with commas. For more information, see <a href=https://help.druva.com/en/articles/8651576-view-oracle-jobs>Job Types.</a>'
