openapi: 3.2.0
info:
  version: '3.0'
  title: Enterprise Workloads Oracle DTC API
servers:
- url: //apis.druva.com/phoenix
tags:
- name: OracleDTC
paths:
  /oraclesbt/v1/orgs/{OrgID}/reports/databases:
    get:
      description: Returns all databases
      tags:
      - OracleDTC
      summary: List all databases
      operationId: ListDatabaseRequest
      parameters:
      - description: The organization ID of your organization. Set it to "0" to select all organizations. Get the ID of an organization using the 'List all organizations' API.
        name: OrgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: ServerName
        description: The name of the Oracle server host registered with Enterprise Workloads. Specify multiple server names by separating them with commas.
        name: serverName
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - x-go-name: DBName
        description: The name of the database. Specify multiple names by separating them with commas.
        name: dbName
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - x-go-name: Token
        description: The token to access the next page of results. Keep this field blank in the first request. Use the token value received in the previous response's parameter 'nextPageToken'.
        name: pageToken
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDatabaseReportResponse'
        '400':
          description: Bad Request
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - Bearer: []
