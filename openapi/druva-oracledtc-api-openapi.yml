            format: int32
      - x-go-name: JobSubType
        description: 'The subtype of the job. This parameter can be set to one or more of the following values: Full Backup, Incremental Backup, and Log Backup. Specify multiple job subtypes by separating them with commas.'
        name: jobSubType
        in: query
        style: form
        explode: false
