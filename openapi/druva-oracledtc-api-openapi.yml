  /oraclesbt/v1/orgs/{orgID}/backupsets/{backupsetID}/snapshots:
    get:
      description: Returns snapshots for the specified backup set.
      tags:
      - OracleDTC
      summary: List all snapshots
      operationId: OracleDTCGetSnapshotsRequest
      security:
      - Bearer: []
      parameters:
      - x-go-name: OrgID
        description: Specify the ID of your organization. Get the ID of an organization using the 'List all organizations' API.
        name: orgID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: BackupSetID
        description: Specify the ID of your backup set. Get the ID of your backup set using the 'List all backup sets' API.
        name: backupsetID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: SnapshotTypes
        description: Specify the type of snapshot. Set it to "HOT", "WARM", or "COLD" to display all snapshots of the specified type. Specify multiple snapshot types by separating the values with commas.
        name: snapshotTypes
        in: query
        schema:
          type: string
      - x-go-name: FromTime
        description: Specify a date and time in the UTC format YYYY-MM-DDTHH:MM:SSZ to display all snapshots created after this date and time.
        name: fromTime
        in: query
        schema:
          type: string
          format: date-time
      - x-go-name: ToTime
        description: Specify a date and time in the UTC format YYYY-MM-DDTHH:MM:SSZ to display all snapshots created before this date and time.
        name: toTime
        in: query
        schema:
          type: string
          format: date-time
      - x-go-name: SortOrder
        description: Specify whether to sort the returned snapshots in ascending or descending order of the snapshot creation time. Set it to "ASC" or "DESC" to sort the list in ascending or descending order respectively. The default value is DESC.
        name: sortOrder
        in: query
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - x-go-name: PageToken
        description: Specify the token to access the results on the next page. Keep this field blank for the first request. To view the results on the next page, use the value received in the 'nextPageToken' parameter of the previous response.
        name: pageToken
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/OracleDTCGetSnapshotsResponse'
        '400':
          description: Bad Request
        '401':
          description: The request did not include an authentication token or the authentication token was expired.
        '403':
          description: Forbidden
        '404':
          description: The requested resource was not found.
        '500':
          description: The request was not processed due to an internal error in Cloud.
