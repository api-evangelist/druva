        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OracleDTCBackupNowRequestParams'
        description: The inputs to the BackupNow job request
        required: true
        x-go-name: Params
      responses:
