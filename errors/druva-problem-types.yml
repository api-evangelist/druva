format: vendor-json
rfc9457: false
note: Druva does NOT use RFC 9457 application/problem+json anywhere in its 970 published operations - zero responses
  declare that media type. Errors are returned as application/json with a vendor envelope. Two envelope shapes are
  in use across the estate, which is itself a finding for a client that has to handle all of them.
envelopes:
- name: APIError
  media_type: application/json
  fields:
  - name: code
    type: string
    note: Product-prefixed application error code, e.g. RealizeUda-1001
  - name: message
    type: string
  - name: data
    type: object
    note: Free-form context; not present in every product
  - name: retryable
    type: boolean
    note: Machine-readable retry hint - the most agent-useful field Druva publishes in an error
  used_by: Enterprise Workloads, Cyber Resilience, MSP, inSync
- name: ServiceError
  media_type: application/json
  fields:
  - name: code
    type: integer
    format: int64
  - name: message
    type: string
  used_by: Enterprise Workloads (godevkit errortype)
status_codes:
- status: 400
  title: Bad Request
  occurrences: 552
  meaning: Invalid or missing arguments; invalid API syntax.
- status: 401
  title: Unauthorized
  occurrences: 787
  meaning: No authentication token supplied, or the token supplied was expired.
  remediation: Re-run the client-credentials exchange against <base>/token. Access tokens live 30 minutes on public
    cloud and Hybrid Workloads GovCloud, 15 minutes on Endpoints and Data Governance GovCloud, and cannot be extended.
- status: 403
  title: Forbidden
  occurrences: 597
  meaning: Insufficient permissions, or the token was minted on a different Druva cloud than the one being called.
  remediation: 'Druva documents the message "User is not authorized to access this resource with an explicit deny"
    for two causes: the caller lacks the Cloud Administrator role, or the token was generated for a different cloud
    (mainline vs GovCloud). Druva also documents 403 as the response to an EXPIRED access token, so a client must
    treat 401 and 403 as the same refresh trigger.'
- status: 404
  title: Not Found
  occurrences: 876
  meaning: The requested resource was not found.
- status: 422
  title: Unprocessable Entity
  occurrences: 54
  meaning: The request was well-formed but not processed due to semantic errors.
- status: 429
  title: Too Many Requests
  occurrences: 2
  meaning: Rate limited.
  note: Declared on only 2 of 970 operations, and Druva documents no rate-limit response headers. See rate-limits/druva-rate-limits.yml.
- status: 500
  title: Internal Server Error
  occurrences: 540
  meaning: The request was not processed due to an internal error in the Druva Cloud.
- status: 501
  title: Not Implemented
  occurrences: 75
  meaning: The requested HTTP method is not implemented for this path.
- status: 503
  title: Service Unavailable
  occurrences: 3
  meaning: The service is not available.
