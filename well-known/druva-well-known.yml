method: probed
source: >-
  Direct HTTPS probes of /.well-known/* on every host this record knows: the registrable
  domain and www, every apis.yml baseURL host, every OpenAPI servers[] host, the docs,
  developer, support, console and MCP hosts, and login.druva.com because the MCP
  authorization-server metadata names it in authorization_endpoint.
note: >-
  Three real documents were served. developer.druva.com publishes a genuine RFC 9727
  api-catalog linkset that enumerates all 19 of Druva's OpenAPI/Swagger definitions with
  service-desc and service-doc links - this is how the specs in openapi/ were located.
  mcp.druva.com publishes RFC 8414 authorization-server metadata plus RFC 9728
  protected-resource metadata for the hosted Druva MCP server. support.druva.com serves a
  real OpenID Provider configuration, but it is the Salesforce Experience Cloud identity
  provider behind the Druva Community, not the authorization server for the Druva product
  APIs - its scopes_supported are Salesforce platform scopes. docs.druva.com answers 200
  with the same 94KB Next.js SPA shell on every /.well-known/ path, which is a soft-404 and
  is recorded as a miss. support.druva.com does the same for every path except
  openid-configuration. apis.druva.com / govapis.druva.com / govcloudapis.druva.com are AWS
  API Gateway hosts that answer 403 "Missing Authentication Token" to any unrouted path.
