method: searched
source: >-
  Registry metadata endpoints (registry.npmjs.org, pypi.org/pypi/<pkg>/json,
  rubygems.org, proxy.golang.org) plus the druvainc GitHub organisation
  (https://github.com/druvainc) and the Druva developer portal SDK/script pages.
note: >-
  Druva publishes NO first-party client library on npm, PyPI, RubyGems, Packagist,
  crates.io, NuGet or Maven Central - every name probed returned 404. Its official Python
  SDK is distributed only as a git subdirectory install from the druvainc/Platform repo,
  which means consumers cannot pin it from a registry, cannot see a published release date,
  and get whatever is on the default branch. The Go helper library is resolvable through
  the Go module proxy and is the only Druva code with a real published version and date.
  For a 970-operation API surface that is a thin distribution story, and it is the finding
  here rather than a gap in this probe.
registries_probed:
