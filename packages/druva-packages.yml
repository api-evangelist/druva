  names: [druvareportsdk, druva, druva-sdk, druva-nativeworkloads-ldk, druva-ldk, nativeworkloads-ldk]
  result: all 404
- registry: npm
  names: [druva, '@druva/sdk']
  result: 404; a keyword search for "druva" returns only third-party packages
- registry: rubygems
  names: [druva]
  result: 404
- registry: golang-proxy
  names: [github.com/druvainc/gorestlib]
  result: v1.0.0 resolved
