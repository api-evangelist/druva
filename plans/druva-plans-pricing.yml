replaces: >-
  This file previously held the 2026-05-04 API Evangelist scaffold - invented Free /
  Professional / Enterprise tiers with a 1,000-request monthly quota and a 10 rpm rate limit,
  none of which Druva has ever published. That content was fabricated and has been removed.
plan_count: 0
priced_plan_count: 0
note: >-
  Druva publishes NAMED editions but no numbers. Every tier page renders a "$" placeholder
  and a "Contact sales" or "Get a quote" path; no per-user, per-TB or per-month figure
  appears anywhere in the public pricing tree, and no currency is stated. Pricing is also
  product-metered (TB/month after deduplication, or per user), not API-metered: there is no
  API call quota, no per-request price and no API-specific plan of any kind. API access is
  included with a Druva subscription and gated by the Cloud Administrator role rather than
  sold separately, so plan_count is recorded as 0 - Druva publishes no purchasable plan with
  a price attached.
api_access_model:
  sold_separately: false
  metered_by_api_calls: false
  gate: >-
    API credentials (Client ID + Secret Key) are created from the Druva Cloud Platform
    Console by a Cloud Administrator; a granular Cloud Admin Read Only role is also
    available. Access follows the product subscription.
  docs: https://help.druva.com/en/articles/8580838-create-and-manage-api-credentials
