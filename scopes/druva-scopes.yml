  description: Grants read access. The only scope declared in any Druva specification.
  source: securitySchemes.OAuth2.flows.clientCredentials.scopes in 11 of 19 specs
docs: https://developer.druva.com/docs/authentication
note: 'Druva declares exactly ONE OAuth scope across its whole 970-operation estate: ''read'', on the
  client-credentials flow, in 11 of 19 specifications. The documentation is explicit that this is not
  an oversight but the design - ''The Client Credentials have access to all the OAuth Scopes by default''
  - so scope is not the authorization boundary. The real boundary is the Druva console role attached to
  the API credential (Cloud Administrator, or the newer Cloud Admin Read Only role for the inSync Cloud
  and Platform APIs), which is not expressed in any contract. An agent therefore cannot request least
  privilege at the token endpoint; least privilege has to be provisioned by a human when the credential
  is minted. The separate MCP server at mcp.druva.com does scope properly - mcp:tools and mcp:resources
  - and is the only Druva surface where scope carries meaning.'
