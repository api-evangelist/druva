aid: druva
name: Druva
description: Druva is a cloud data protection and management company running the Druva Resilience Cloud, a fully
  managed SaaS platform for backup, disaster recovery, cyber resilience and data governance across endpoints, data
  centres, AWS and Azure workloads, and SaaS applications including Microsoft 365, Google Workspace, Salesforce,
  Dynamics 365, Entra ID and Okta. Druva publishes 19 first-party OpenAPI and Swagger definitions covering roughly
  970 operations from its developer portal, advertised in an RFC 9727 API catalog document, spanning Endpoints and
  Data Governance, Enterprise Workloads, Cyber Resilience, AWS Native Workloads and CloudRanger, MSP tenant management,
  Platform administration and job management - each with a separate GovCloud contract where one exists. Authentication
  is OAuth 2.0 client credentials against a per-cloud token endpoint, and Druva also runs a first-party hosted MCP
  server at mcp.druva.com for AI agents.
