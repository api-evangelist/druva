- aid: druva:mcp
  name: Druva MCP Server
  description: Druva's first-party hosted Model Context Protocol server. MCP-compatible AI clients connect to a
    single global endpoint over streamable HTTP, authenticate with 3-legged OAuth 2.1 and PKCE, and reach the Druva
    Resilience Cloud through five tools that discover and execute cloud-delivered skills across endpoint health,
    SaaS apps, cyber resilience and data governance. Destructive deletes are blocked server-side and every call
    is bounded by the caller's Druva RBAC.
  humanURL: https://help.druva.com/en/articles/15654265-getting-started-with-the-druva-mcp-server
  baseURL: https://mcp.druva.com/mcp
  tags:
